<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulacro Definitivo 2026 - Versión Oscura (Bilingüe + Retroalimentación)</title>
    <style>
        :root {
            /* Tema Oscuro (Defecto) */
            --bg-body: #121212;
            --bg-container: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #b0bec5;
            --btn-bg: #2c2c2c;
            --btn-border: #424242;
            --btn-hover: #3d3d3d;
            --primary: #00838f;
            --primary-hover: #006064;
            --correct-bg: #1b5e20;
            --correct-border: #2e7d32;
            --correct-text: #c8e6c9;
            --incorrect-bg: #b71c1c;
            --incorrect-border: #c62828;
            --incorrect-text: #ffcdd2;
            --explanation-bg: #263238;
            --explanation-border: #37474f;
            --explanation-text: #e0f7fa;
        }

        /* Tema Claro */
        body.light-theme {
            --bg-body: #f4f7f6;
            --bg-container: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --btn-bg: #f8f9fa;
            --btn-border: #dee2e6;
            --btn-hover: #e9ecef;
            --primary: #1a73e8;
            --primary-hover: #1557b0;
            --correct-bg: #d4edda;
            --correct-border: #c3e6cb;
            --correct-text: #155724;
            --incorrect-bg: #f8d7da;
            --incorrect-border: #f5c6cb;
            --incorrect-text: #721c24;
            --explanation-bg: #e3f2fd;
            --explanation-border: #bbdefb;
            --explanation-text: #0d47a1;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; transition: all 0.3s ease; }
        .container { background: var(--bg-container); max-width: 800px; width: 100%; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: all 0.3s ease; }
        
        .top-controls { display: flex; justify-content: space-between; margin-bottom: 20px; align-items: center;}
        .theme-btn, .lang-btn { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .theme-btn:hover, .lang-btn:hover { background: var(--primary-hover); }
        
        h1 { text-align: center; font-size: 26px; margin-bottom: 5px; }
        h2 { text-align: center; color: var(--text-muted); font-size: 16px; margin-top: 0; margin-bottom: 20px; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid var(--btn-border); padding-bottom: 10px;}
        .progress { font-size: 14px; color: var(--text-muted); font-weight: bold;}
        .exam-info { color: var(--primary); font-size: 14px; font-weight: bold; }
        
        /* Quiz */
        .question-container { display: none; }
        .question-container.active { display: block; }
        .question-text { font-size: 18px; line-height: 1.6; margin-bottom: 20px; font-weight: 500; text-align: justify; }
        
        .option { display: block; width: 100%; text-align: left; background: var(--btn-bg); border: 2px solid var(--btn-border); padding: 15px; margin-bottom: 12px; border-radius: 8px; cursor: pointer; font-size: 16px; transition: all 0.2s; line-height: 1.4; color: var(--text-main); }
        .option:hover { background: var(--btn-hover); }
        .option.correct { background: var(--correct-bg); border-color: var(--correct-border); color: var(--correct-text); pointer-events: none; }
        .option.incorrect { background: var(--incorrect-bg); border-color: var(--incorrect-border); color: var(--incorrect-text); pointer-events: none; }
        .option:disabled { cursor: default; opacity: 0.8;}
        
        #feedback { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; font-weight: bold; text-align: center; font-size: 18px;}
        .feedback-correct { background: var(--correct-bg); color: var(--correct-text); border: 1px solid var(--correct-border); }
        .feedback-incorrect { background: var(--incorrect-bg); color: var(--incorrect-text); border: 1px solid var(--incorrect-border); }
        
        /* Explanation Box */
        #explanation-box { margin-top: 15px; padding: 20px; border-radius: 8px; display: none; background: var(--explanation-bg); border: 1px solid var(--explanation-border); color: var(--explanation-text); font-size: 15px; line-height: 1.6; text-align: justify;}
        
        .btn-next { display: none; width: 100%; padding: 18px; margin-top: 25px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.2s;}
        .btn-next:hover { background: var(--primary-hover); }
        
        /* Result Screen */
        #result-screen { display: none; text-align: center; }
        .score { font-size: 54px; font-weight: bold; color: var(--primary); margin: 20px 0; }
        .btn-restart { background: var(--primary); color: white; border: none; border-radius: 8px; padding: 15px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 30px;}
        .btn-restart:hover { background: var(--primary-hover);}
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Controls -->
        <div class="top-controls">
            <button class="theme-btn" onclick="toggleTheme()" id="theme-btn">☀️ Cambiar a Modo Claro</button>
            <button class="lang-btn" onclick="toggleLanguage()" id="lang-btn">🇬🇧 Leer en Español / English</button>
        </div>

        <h1 id="main-title">Simulacro Definitivo 2026</h1>
        <h2 id="sub-title">Ascenso EBR Secundaria - Inglés como Lengua Extranjera</h2>
        
        <div id="quiz-container">
            <div class="header-bar">
                <div class="exam-info" id="info-text">60 Preguntas Prospectivas y CLOZE Test</div>
                <div id="progress-text" class="progress"></div>
            </div>
            
            <div id="quiz-area">
                <!-- Questions injected here -->
            </div>
            
            <div id="feedback"></div>
            <div id="explanation-box"></div>
            
            <button id="btn-next" class="btn-next" onclick="nextQuestion()">Siguiente Pregunta</button>
        </div>

        <div id="result-screen">
            <h2 id="res-title">¡Examen Finalizado!</h2>
            <p id="res-desc">Has completado el Simulacro Definitivo 2026. Tu puntaje final es:</p>
            <div class="score" id="final-score">0 / 0</div>
            <p id="final-message"></p>
            <button class="btn-restart" onclick="location.reload()" id="res-btn">Volver a intentar el simulacro</button>
        </div>
    </div>

    <!-- Cargar Google Translate Script de forma invisible para la traducción rápida del botón -->
    <div id="google_translate_element" style="display:none;"></div>
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'en', includedLanguages: 'es', autoDisplay: false}, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        const questions = [{"text": "During a planning session, a teacher decides to present a new reading using a written text, an audio recording of the text, and a short video summarizing it. According to the Universal Design for Learning (DUA), which principle is the teacher applying?", "options": [{"id": "A", "text": "Provide multiple means of engagement."}, {"id": "B", "text": "Provide multiple means of representation."}, {"id": "C", "text": "Provide multiple means of action and expression."}], "correct": "B", "id": 1, "explanation": "En el Dise\u00f1o Universal para el Aprendizaje (DUA), ofrecer informaci\u00f3n a trav\u00e9s de varios formatos (texto escrito, audio y video) responde directamente al principio de proveer m\u00faltiples formas de Representaci\u00f3n."}, {"text": "Mr. Lopez wants his students to plan a weekend trip in groups. First, they discuss the destination, then they negotiate the budget, and finally, they present their itinerary. After the presentations, Mr. Lopez highlights some useful vocabulary and grammar the students used or needed. Which methodology is Mr. Lopez implementing?", "options": [{"id": "A", "text": "Presentation-Practice-Production (PPP)."}, {"id": "B", "text": "Content-Based Learning."}, {"id": "C", "text": "Task-Based Learning."}], "correct": "C", "id": 2, "explanation": "El 'Task-Based Learning' se enfoca en que los estudiantes realicen una tarea significativa (planear un viaje) enfoc\u00e1ndose en el significado. Solo al final (post-task), el profesor interviene para revisar la gram\u00e1tica utilizada."}, {"text": "Before reading a text about global warming, the teacher shows the students the title and three pictures from the text. She asks them to guess what the main conflict in the story will be. Which reading process is the teacher promoting?", "options": [{"id": "A", "text": "Bottom-up processing."}, {"id": "B", "text": "Top-down processing."}, {"id": "C", "text": "Intensive reading."}], "correct": "B", "id": 3, "explanation": "El procesamiento 'Top-down' se basa en utilizar el conocimiento previo y las pistas globales (como el t\u00edtulo y las im\u00e1genes) para hacer hip\u00f3tesis y predecir el contenido antes de leer."}, {"text": "During a writing workshop, the students have already brainstormed ideas and written a first draft. Now, the teacher asks them to read their texts again and check if their ideas are logically connected and if the overall message is clear. Which stage of the writing process are the students in?", "options": [{"id": "A", "text": "Drafting."}, {"id": "B", "text": "Revising."}, {"id": "C", "text": "Editing."}], "correct": "B", "id": 4, "explanation": "La fase de 'Revisi\u00f3n' (Revising) del proceso de escritura se centra en la organizaci\u00f3n global, la conexi\u00f3n l\u00f3gica de ideas y la claridad del mensaje, dejando la ortograf\u00eda para la etapa de 'Editing'."}, {"text": "A teacher gives her students a tourist brochure and asks them to quickly find the opening hours of the museum and the price of the tickets. Which reading skill is the teacher aiming to develop?", "options": [{"id": "A", "text": "Scanning."}, {"id": "B", "text": "Skimming."}, {"id": "C", "text": "Predicting."}], "correct": "A", "id": 5, "explanation": "La t\u00e9cnica de 'Scanning' consiste en buscar informaci\u00f3n o datos espec\u00edficos muy r\u00e1pidamente en un texto (como un n\u00famero, precio o un horario) sin leer el resto."}, {"text": "The teacher writes three conditional sentences on the board (e.g., 'If it rains, I will stay home'). Instead of explaining the rule, she asks the students to analyze the sentences and discover the grammar pattern by themselves. Which approach to teaching grammar is she using?", "options": [{"id": "A", "text": "Deductive approach."}, {"id": "B", "text": "Inductive approach."}, {"id": "C", "text": "Communicative approach."}], "correct": "B", "id": 6, "explanation": "El enfoque Inductivo ('Inductive approach') requiere que los estudiantes analicen ejemplos reales primero y descubran o deduzcan por ellos mismos la regla gramatical subyacente."}, {"text": "A group of students firmly believes that regular verbs in the past always end in the /t/ sound. The teacher plays an audio where native speakers clearly pronounce the word 'wanted' as /w\u0252nt\u026ad/. The students look confused. From a pedagogical perspective, what has the teacher created?", "options": [{"id": "A", "text": "Cognitive conflict."}, {"id": "B", "text": "Meaningful learning."}, {"id": "C", "text": "Scaffolding."}], "correct": "A", "id": 7, "explanation": "Al enfrentar a los estudiantes con una situaci\u00f3n real (audio) que contradice directamente su creencia err\u00f3nea previa, el profesor ha generado un claro 'conflicto cognitivo' (Cognitive conflict)."}, {"text": "The students are listening to a podcast where two friends are talking about a movie. The teacher asks the students: 'How does the woman feel about the movie? Is she excited or disappointed? Focus on her tone of voice.' Which listening capacity is being developed?", "options": [{"id": "A", "text": "Listening for specific information."}, {"id": "B", "text": "Detecting connectors."}, {"id": "C", "text": "Inferring attitude."}], "correct": "C", "id": 8, "explanation": "Deducir si una persona est\u00e1 emocionada o decepcionada bas\u00e1ndose \u00fanicamente en el tono de su voz y su actitud, m\u00e1s all\u00e1 de las palabras literales, es 'Inferir actitud' (Inferring attitude)."}, {"text": "Before an oral presentation, the teacher reminds the students to make eye contact with the audience, use hand gestures to emphasize points, and smile. Which aspect of oral production is the teacher focusing on?", "options": [{"id": "A", "text": "Paraverbal sources."}, {"id": "B", "text": "Nonverbal sources."}, {"id": "C", "text": "Fluency."}], "correct": "B", "id": 9, "explanation": "Los recursos 'No verbales' (Nonverbal sources) se refieren a la comunicaci\u00f3n puramente corporal, incluyendo el contacto visual, los gestos manuales, expresiones faciales y posturas."}, {"text": "While students are working on a collaborative project, the teacher walks around the classroom with a checklist, giving them immediate suggestions on how to improve their group work and language use. What kind of evaluation is this?", "options": [{"id": "A", "text": "Summative evaluation."}, {"id": "B", "text": "Diagnostic evaluation."}, {"id": "C", "text": "Formative evaluation."}], "correct": "C", "id": 10, "explanation": "La evaluaci\u00f3n que ocurre durante el proceso, dando sugerencias y retroalimentaci\u00f3n inmediata para mejorar sin asignar una nota cuantitativa, es la evaluaci\u00f3n formativa (Formative evaluation)."}, {"text": "A student writes: 'I love playing soccer. I am not very good at it. I practice every day.' The teacher wants the student to improve the text by using words like 'However' and 'Therefore'. Which aspect of writing does the teacher want to improve?", "options": [{"id": "A", "text": "Coherence."}, {"id": "B", "text": "Cohesion."}, {"id": "C", "text": "Accuracy."}], "correct": "B", "id": 11, "explanation": "La 'Cohesi\u00f3n' (Cohesion) es la propiedad estructural que permite conectar gramatical y l\u00e9xicamente las oraciones aisladas entre s\u00ed mediante el uso de conectores (However, Therefore)."}, {"text": "The teacher asks the students to investigate the problem of stray dogs in their neighborhood over the course of a month, propose a solution, and create an awareness campaign in English. Which methodology is being applied?", "options": [{"id": "A", "text": "Problem-Based Learning."}, {"id": "B", "text": "Project-Based Learning."}, {"id": "C", "text": "Inquiry-Based Learning."}], "correct": "B", "id": 12, "explanation": "El Aprendizaje Basado en Proyectos (Project-Based Learning) implica que los estudiantes investiguen un problema real y creen un producto final tangible (una campa\u00f1a) como soluci\u00f3n."}, {"text": "When teaching food vocabulary, the teacher asks the students to categorize the food items based on what they actually eat for breakfast, lunch, and dinner in their own homes. Which pedagogical principle is mostly promoted here?", "options": [{"id": "A", "text": "Meaningful learning."}, {"id": "B", "text": "Autonomous learning."}, {"id": "C", "text": "Collaborative learning."}], "correct": "A", "id": 13, "explanation": "El 'Aprendizaje Significativo' se logra cuando el estudiante puede anclar o conectar el nuevo conocimiento (vocabulario de comida) directamente con la realidad y rutina de su propio hogar."}, {"text": "During a free speaking activity, a student is trying to explain a story but makes several grammar mistakes. The teacher interrupts the student every time a mistake is made to correct it. Which of the following is a valid criticism of the teacher's action?", "options": [{"id": "A", "text": "The teacher should correct the student at the end of the activity to avoid breaking the student's fluency."}, {"id": "B", "text": "The teacher should ask the other students to correct the mistakes immediately to promote peer learning."}, {"id": "C", "text": "The teacher should only correct pronunciation mistakes during free speaking activities."}], "correct": "A", "id": 14, "explanation": "En una actividad libre orientada a la 'Fluidez', interrumpir constantemente para corregir gram\u00e1tica bloquea al estudiante y corta el flujo comunicativo. La correcci\u00f3n debi\u00f3 ser diferida (A)."}, {"text": "To foster a love for reading, the teacher allows students to choose any graded reader from the library and read it at home for pleasure, without asking them to complete comprehension exercises. Which approach is this?", "options": [{"id": "A", "text": "Intensive reading."}, {"id": "B", "text": "Extensive reading."}, {"id": "C", "text": "Bottom-up reading."}], "correct": "B", "id": 15, "explanation": "La 'Lectura Extensiva' (Extensive reading) se refiere a leer material por puro placer, en casa, de forma fluida y sin el estr\u00e9s de evaluaciones o test obligatorios."}, {"text": "According to the 2026 syllabus, teaching grammar should prioritize 'use' over 'usage'. Which of the following activities best aligns with this principle?", "options": [{"id": "A", "text": "Having students memorize the conjugation table of irregular verbs in the simple past."}, {"id": "B", "text": "Having students complete a worksheet where they fill in the blanks with 'was' or 'were'."}, {"id": "C", "text": "Having students role-play a job interview where they must talk about their past experiences."}], "correct": "C", "id": 16, "explanation": "El Minedu establece priorizar el 'uso' (prop\u00f3sito comunicativo) sobre las reglas abstractas. Hacer un role-play exige usar la gram\u00e1tica de forma espont\u00e1nea y realista para comunicar un mensaje (C)."}, {"text": "During a listening activity, the teacher asks the students to raise their hands every time they hear the words 'because', 'but', or 'so'. Which listening capacity is the teacher developing?", "options": [{"id": "A", "text": "Detecting connectors."}, {"id": "B", "text": "Listening for details."}, {"id": "C", "text": "Inferring and interpreting information."}], "correct": "A", "id": 17, "explanation": "Los conectores l\u00f3gicos ('because', 'but', 'so') unen ideas. Identificarlos conscientemente en el flujo de un audio es un ejercicio para la capacidad de 'Detecting connectors'."}, {"text": "A student is struggling to start his oral presentation. The teacher approaches him and whispers: 'You can start by saying: Good morning, today I am going to talk about...' The student smiles, says the phrase, and continues his presentation. What process did the teacher use?", "options": [{"id": "A", "text": "Metacognition."}, {"id": "B", "text": "Scaffolding (Andamiaje)."}, {"id": "C", "text": "Cognitive demand."}], "correct": "B", "id": 18, "explanation": "El 'Andamiaje' (Scaffolding) es el soporte o pista temporal que el docente brinda al estudiante para ayudarlo a cruzar una barrera que no podr\u00eda superar por s\u00ed solo."}, {"text": "A teacher wants to help students distinguish between the vowel sounds in 'ship' and 'sheep' by playing an audio track and asking them to circle the word they hear. Which type of processing is this?", "options": [{"id": "A", "text": "Top-down processing."}, {"id": "B", "text": "Bottom-up processing."}, {"id": "C", "text": "Interactive processing."}], "correct": "B", "id": 19, "explanation": "El procesamiento 'Bottom-up' empieza por discriminar los elementos m\u00e1s peque\u00f1os del idioma (como diferenciar fonemas voc\u00e1licos de 'ship' vs 'sheep') antes de pasar al contexto macro."}, {"text": "A student wrote a very formal email to a close friend inviting him to a birthday party. The teacher tells the student: 'Your grammar is perfect, but this sounds like an email to a boss. How would you talk to your best friend?' Which writing capacity is being addressed?", "options": [{"id": "A", "text": "Adapting texts according to the communicative situation."}, {"id": "B", "text": "Organizing ideas in a coherent way."}, {"id": "C", "text": "Using written language conventions adequately."}], "correct": "A", "id": 20, "explanation": "Redactar adecuadamente no solo requiere gram\u00e1tica, sino ajustar el tono (registro formal/informal) seg\u00fan qui\u00e9n es el destinatario. Esto es 'Adaptar textos de acuerdo a la situaci\u00f3n comunicativa'."}, {"text": "The English teacher collaborates with the Science teacher. During the English class, the students learn the water cycle, using English as the medium of instruction. Which methodology is being used?", "options": [{"id": "A", "text": "Problem-Based Learning."}, {"id": "B", "text": "Content-Based Learning."}, {"id": "C", "text": "Task-Based Learning."}], "correct": "B", "id": 21, "explanation": "El 'Content-Based Learning' (Aprendizaje Basado en Contenidos) consiste en ense\u00f1ar otras \u00e1reas curriculares (como biolog\u00eda o el ciclo del agua) utilizando la lengua extranjera como el veh\u00edculo de instrucci\u00f3n."}, {"text": "The teacher gives the students a perfect model of a formal letter. She asks them to analyze its structure and then write an almost identical letter, changing only the names and dates. Which approach to writing is this?", "options": [{"id": "A", "text": "Process writing."}, {"id": "B", "text": "Product writing."}, {"id": "C", "text": "Creative writing."}], "correct": "B", "id": 22, "explanation": "En el enfoque 'Product writing', el estudiante debe imitar un texto modelo perfecto provisto por el profesor, enfoc\u00e1ndose en copiar la estructura en lugar de seguir un proceso creativo."}, {"text": "The teacher plays a 3-minute news report. Before playing it, she asks: 'Listen to the report and tell me, what is the main event being reported?' Which listening skill is being promoted?", "options": [{"id": "A", "text": "Listening for specific information."}, {"id": "B", "text": "Listening for gist."}, {"id": "C", "text": "Inferring attitude."}], "correct": "B", "id": 23, "explanation": "Escuchar un audio de noticias por primera vez con la \u00fanica intenci\u00f3n de extraer la idea o suceso central de forma general es escuchar para obtener el 'Gist'."}, {"text": "Before reading an article about space exploration, the teacher asks the students: 'What do you already know about Mars? What would you like to know?' Which pedagogical step is the teacher executing?", "options": [{"id": "A", "text": "Creating cognitive conflict."}, {"id": "B", "text": "Providing feedback."}, {"id": "C", "text": "Activating prior knowledge."}], "correct": "C", "id": 24, "explanation": "Hacer preguntas iniciales sobre lo que los alumnos ya saben de un tema ('What do you already know?') es el m\u00e9todo est\u00e1ndar para activar esquemas mentales previos (Activating prior knowledge)."}, {"text": "While reading, a student finds the word 'hilarious'. The sentence says: 'The movie was so hilarious that we couldn't stop laughing until our stomachs hurt.' The teacher asks the student to guess the meaning based on the rest of the sentence. Which reading skill is this?", "options": [{"id": "A", "text": "Deducing meaning from context."}, {"id": "B", "text": "Skimming."}, {"id": "C", "text": "Paraphrasing."}], "correct": "A", "id": 25, "explanation": "Adivinar el significado de una palabra desconocida vali\u00e9dose de la deducci\u00f3n l\u00f3gica del resto de la oraci\u00f3n es 'Deducir el significado a trav\u00e9s del contexto'."}, {"text": "During a speaking activity, a student says: 'Yesterday I goed to the cinema.' The teacher replies: 'Oh, you went to the cinema? What movie did you see?' Which feedback technique is the teacher using?", "options": [{"id": "A", "text": "Clarification request."}, {"id": "B", "text": "Recast."}, {"id": "C", "text": "Explicit correction."}], "correct": "B", "id": 26, "explanation": "El 'Recast' es una correcci\u00f3n sumamente sutil donde el profesor reforma la frase incorrecta del alumno y se la devuelve oralmente de manera natural, sin interrumpir la charla."}, {"text": "A student's paragraph has excellent grammar and linking words, but the ideas jump randomly from one topic to another without a logical sequence. Which aspect of writing needs improvement?", "options": [{"id": "A", "text": "Cohesion."}, {"id": "B", "text": "Coherence."}, {"id": "C", "text": "Vocabulary range."}], "correct": "B", "id": 27, "explanation": "La 'Coherencia' (Coherence) se refiere a la l\u00f3gica interna de las ideas del texto. Si las ideas saltan sin sentido de un tema a otro, hay un grave fallo de coherencia."}, {"text": "The teacher uses the 'Jigsaw' technique: she divides a text into four parts, assigns one part to each student in a group, and they must share their information to understand the whole text. Which methodology is mainly applied here?", "options": [{"id": "A", "text": "Cooperative Learning."}, {"id": "B", "text": "Blended Learning."}, {"id": "C", "text": "Presentation-Practice-Production."}], "correct": "A", "id": 28, "explanation": "La t\u00e9cnica de 'Jigsaw' es una metodolog\u00eda pura de Aprendizaje Cooperativo (Cooperative Learning) en la que cada estudiante tiene una pieza de informaci\u00f3n vital y dependen unos de otros."}, {"text": "The teacher organizes a classroom debate. Students must defend or oppose the use of school uniforms, providing reasons and challenging the other team's points. Which oral capacity is primarily being developed?", "options": [{"id": "A", "text": "Using nonverbal sources."}, {"id": "B", "text": "Developing argumentation skills."}, {"id": "C", "text": "Paraphrasing ideas."}], "correct": "B", "id": 29, "explanation": "Un debate, al exigir justificar opiniones, estructurar razones l\u00f3gicas y rebatir a la otra parte, es la actividad ideal para desarrollar habilidades argumentativas (Argumentation skills)."}, {"text": "After writing the first draft of an essay, the teacher asks the students to exchange their papers with a partner. They use a rubric provided by the teacher to evaluate their partner's work. What type of evaluation is this?", "options": [{"id": "A", "text": "Self-assessment."}, {"id": "B", "text": "Peer-assessment."}, {"id": "C", "text": "Summative assessment."}], "correct": "B", "id": 30, "explanation": "La evaluaci\u00f3n 'entre pares' (Peer-assessment) ocurre cuando un estudiante revisa el trabajo de su compa\u00f1ero usando par\u00e1metros claros (r\u00fabricas) dados por el docente."}, {"text": "The students read a text about technology. The teacher asks them to create a table and list the 'advantages' in one column and the 'disadvantages' in another. Which reading skill is being practiced?", "options": [{"id": "A", "text": "Summarizing."}, {"id": "B", "text": "Predicting."}, {"id": "C", "text": "Categorizing."}], "correct": "C", "id": 31, "explanation": "Clasificar la informaci\u00f3n del texto en grupos predefinidos (en este caso, armar una tabla de 'ventajas' por un lado y 'desventajas' por otro) corresponde a la habilidad de 'Categorizar'."}, {"text": "Instead of teaching the grammatical rules of 'can' and 'could', the teacher designs a role-play where students are at a hotel and must politely ask the receptionist for extra towels or a late check-out. What is the teacher prioritizing?", "options": [{"id": "A", "text": "Usage (rules and structures)."}, {"id": "B", "text": "Use (communicative meaning of language)."}, {"id": "C", "text": "Written language conventions."}], "correct": "B", "id": 32, "explanation": "Priorizar el 'Uso' (Use) implica ense\u00f1ar gram\u00e1tica mediante funciones de la vida real. Un role-play en un hotel obliga al alumno a usar 'can' y 'could' con su verdadero prop\u00f3sito social (pedir un servicio)."}, {"text": "The teacher pauses a video halfway through and asks the students: 'Based on what you just saw, what do you think the main character will do next?' Which capacity is being developed?", "options": [{"id": "A", "text": "Predicting content."}, {"id": "B", "text": "Inferring attitude."}, {"id": "C", "text": "Listening for details."}], "correct": "A", "id": 33, "explanation": "Detener la informaci\u00f3n (video o texto) en un punto clave para pedir a los estudiantes que usen la l\u00f3gica y anticipen qu\u00e9 ocurrir\u00e1 a continuaci\u00f3n, es la habilidad de 'Predecir contenido' (Predicting)."}, {"text": "A teacher ensures that reading materials include characters from diverse cultural backgrounds and abilities, promoting respect and valuing differences in the classroom. Which Transversal Approach from the National Curriculum is she promoting?", "options": [{"id": "A", "text": "Environmental Approach."}, {"id": "B", "text": "Inclusive Approach or Attention to Diversity."}, {"id": "C", "text": "Intercultural Approach."}], "correct": "B", "id": 34, "explanation": "El Enfoque Transversal Inclusivo o de Atenci\u00f3n a la Diversidad fomenta la equidad, promoviendo el respeto, la tolerancia y visibilizando realidades m\u00faltiples en el aula sin discriminaci\u00f3n."}, {"text": "A teacher introduces new vocabulary using flashcards (Stage 1), asks students to complete a matching exercise (Stage 2), and finally tells them to use the new words to describe their own bedrooms to a partner (Stage 3). Which framework is this?", "options": [{"id": "A", "text": "Presentation-Practice-Production (PPP)."}, {"id": "B", "text": "Task-Based Learning (TBL)."}, {"id": "C", "text": "Project-Based Learning (PBL)."}], "correct": "A", "id": 35, "explanation": "La secuencia presentada describe las tres fases del modelo 'PPP': Stage 1 (Presentation), Stage 2 controlada (Practice) y Stage 3 libre (Production)."}, {"text": "After reading a 5-paragraph text, the teacher asks the students to state the core message of the text in just two sentences. Which reading skill is required?", "options": [{"id": "A", "text": "Paraphrasing."}, {"id": "B", "text": "Summarizing."}, {"id": "C", "text": "Contextualizing."}], "correct": "B", "id": 36, "explanation": "La capacidad mental de condensar y extraer \u00fanicamente el mensaje central de un texto grande para escribirlo en solo dos oraciones se denomina 'Resumir' (Summarizing)."}, {"text": "At the end of the lesson, the teacher asks the students to reflect on the following questions: 'What did I learn today? How did I learn it? What was difficult for me?' What cognitive process is the teacher fostering?", "options": [{"id": "A", "text": "Metacognition."}, {"id": "B", "text": "Cognitive demand."}, {"id": "C", "text": "Scaffolding."}], "correct": "A", "id": 37, "explanation": "La 'Metacognici\u00f3n' es el proceso de pensar sobre nuestro propio pensamiento. Reflexionar sobre 'c\u00f3mo aprend\u00ed esto' fortalece el pensamiento aut\u00f3nomo y autorregulado del alumno."}, {"text": "When a student forgets a word during a speech, the teacher pauses, makes a gesture, and says 'You went to the...?' waiting for the student to remember and say 'cinema'. What is this technique called?", "options": [{"id": "A", "text": "Elicitation."}, {"id": "B", "text": "Recast."}, {"id": "C", "text": "Delayed correction."}], "correct": "A", "id": 38, "explanation": "La 'Elicitaci\u00f3n' (Elicitation) es la t\u00e9cnica en la que el docente no da la respuesta correcta directamente, sino que induce (con pausas o gestos) a que el alumno mismo la recuerde y la diga."}, {"text": "During a free speaking fluency activity, the teacher walks around with a notebook, writing down the most common grammar mistakes students make. Ten minutes before the class ends, she writes them on the board and discusses them with the whole class. What is this called?", "options": [{"id": "A", "text": "Immediate feedback."}, {"id": "B", "text": "Delayed feedback / correction."}, {"id": "C", "text": "Peer assessment."}], "correct": "B", "id": 39, "explanation": "La retroalimentaci\u00f3n diferida ('Delayed feedback') consiste en anotar los errores sin interrumpir la fluidez oral, para luego revisarlos de forma an\u00f3nima y general al final de la clase."}, {"text": "A teacher has a student with a visual impairment in the classroom. When presenting a reading text, the teacher provides the text in a larger font and also an audio version of it. Which pedagogical principle is she applying?", "options": [{"id": "A", "text": "Inclusive Education."}, {"id": "B", "text": "Cognitive Conflict."}, {"id": "C", "text": "Summative Evaluation."}], "correct": "A", "id": 40, "explanation": "Brindar los textos en m\u00faltiples formatos accesibles, como macrotipo (letras grandes) y audio para cubrir necesidades visuales, es un principio rector de la 'Educaci\u00f3n Inclusiva'."}, {"text": "Instead of asking students to memorize a list of vocabulary, the teacher asks them to evaluate a controversial article and create their own counter-arguments in English. According to pedagogical principles, this activity has:", "options": [{"id": "A", "text": "Low cognitive demand."}, {"id": "B", "text": "High cognitive demand."}, {"id": "C", "text": "No cognitive conflict."}], "correct": "B", "id": 41, "explanation": "El pensamiento cr\u00edtico y la argumentaci\u00f3n exigen procesar informaci\u00f3n compleja, analizarla y sintetizar ideas nuevas, lo que genera una tarea de 'Alta demanda cognitiva' (High cognitive demand)."}, {"text": "After a debate, the teacher asks the students to evaluate the arguments and fluency of the opposing team using a checklist. What type of assessment is this?", "options": [{"id": "A", "text": "Self-assessment."}, {"id": "B", "text": "Peer-assessment."}, {"id": "C", "text": "Summative assessment."}], "correct": "B", "id": 42, "explanation": "Cuando los propios estudiantes eval\u00faan el desempe\u00f1o o los argumentos del equipo contrario usando una lista de cotejo u otra herramienta objetiva, est\u00e1n realizando 'Peer-assessment'."}, {"text": "The teacher sets up a situation: 'You are planning a surprise party for a friend.' The students work in groups to decide the food, music, and guests. After they complete the activity, the teacher highlights the language they needed (e.g., 'Let's buy...', 'How about...'). Which methodology is this?", "options": [{"id": "A", "text": "Presentation-Practice-Production (PPP)."}, {"id": "B", "text": "Content-Based Learning."}, {"id": "C", "text": "Task-Based Learning."}], "correct": "C", "id": 43, "explanation": "El 'Task-Based Learning' (Aprendizaje Basado en Tareas) se centra en hacer que los alumnos resuelvan una situaci\u00f3n del mundo real (planear la fiesta) y solo al final se trabaja la gram\u00e1tica empleada."}, {"text": "A student says: 'My friend gave me some good advices.' The teacher shows the student a dictionary entry indicating that 'advice' is an uncountable noun. The student realizes his previous assumption was wrong and adjusts his understanding. What cognitive process did the teacher trigger?", "options": [{"id": "A", "text": "Meaningful learning."}, {"id": "B", "text": "Cognitive conflict (Disonancia cognitiva)."}, {"id": "C", "text": "Scaffolding."}], "correct": "B", "id": 44, "explanation": "Un estudiante asume l\u00f3gicamente que 'advice' se pluraliza igual que otras palabras, pero el docente le muestra en el diccionario que es incontable ('advices' no existe). Esto derrumba su esquema previo, generando un claro conflicto cognitivo."}, {"text": "The school has implemented a new methodology where students watch grammar explanations and complete interactive exercises on an online platform at home, and then use class time purely for speaking and communicative tasks. Which methodology is being applied?", "options": [{"id": "A", "text": "Task-Based Learning."}, {"id": "B", "text": "Project-Based Learning."}, {"id": "C", "text": "Blended Learning."}], "correct": "C", "id": 45, "explanation": "El 'Blended Learning' (Aprendizaje H\u00edbrido/Mixto) fusiona lo mejor de la educaci\u00f3n en l\u00ednea asincr\u00f3nica en casa, con la instrucci\u00f3n presencial din\u00e1mica y pr\u00e1ctica en el aula f\u00edsica."}, {"text": "CLOZE: Read the following text excerpt and complete the blanks with the best option.The Benefits of Extensive ReadingExtensive reading (ER) is an approach to language learning that encourages students to read a large (46) ______ of books.", "options": [{"id": "A", "text": "amount"}, {"id": "B", "text": "number"}, {"id": "C", "text": "quantity"}], "correct": "B", "id": 46, "explanation": "La combinaci\u00f3n (collocation) correcta para referirse a un alto volumen de libros es 'large number of books', ya que los libros son sustantivos contables."}, {"text": "CLOZE: Unlike intensive reading, where the focus is (47) ______ grammar and vocabulary, ER focuses on reading for pleasure.", "options": [{"id": "A", "text": "in"}, {"id": "B", "text": "at"}, {"id": "C", "text": "on"}], "correct": "C", "id": 47, "explanation": "La preposici\u00f3n correcta que sigue al sustantivo 'focus' cuando nos referimos a centrar la atenci\u00f3n en algo es siempre 'on' (focus ON)."}, {"text": "CLOZE: Students are allowed to choose their (48) ______ books.", "options": [{"id": "A", "text": "own"}, {"id": "B", "text": "proper"}, {"id": "C", "text": "self"}], "correct": "A", "id": 48, "explanation": "La frase idiom\u00e1tica para indicar que alguien escoge algo por s\u00ed mismo y que le pertenece de manera particular es 'choose their OWN books'."}, {"text": "CLOZE: This autonomy helps to (49) ______ their motivation.", "options": [{"id": "A", "text": "rise"}, {"id": "B", "text": "boost"}, {"id": "C", "text": "enlarge"}], "correct": "B", "id": 49, "explanation": "El verbo com\u00fanmente usado en ingl\u00e9s para referirse a elevar o potenciar la motivaci\u00f3n, la energ\u00eda o la moral es 'boost'."}, {"text": "CLOZE: Furthermore, students read at their own (50) ______, without the pressure of testing.", "options": [{"id": "A", "text": "pace"}, {"id": "B", "text": "step"}, {"id": "C", "text": "rhythm"}], "correct": "A", "id": 50, "explanation": "La expresi\u00f3n para indicar la velocidad personal de trabajo o lectura de alguien es 'at their own pace' (a su propio ritmo)."}, {"text": "CLOZE: Research has shown that ER can significantly (51) ______ students' vocabulary.", "options": [{"id": "A", "text": "expand"}, {"id": "B", "text": "grow"}, {"id": "C", "text": "stretch"}], "correct": "A", "id": 51, "explanation": "El verbo ideal para hablar sobre el crecimiento intelectual o el ensanchamiento del vocabulario de una persona es 'expand'."}, {"text": "CLOZE: When learners encounter words repeatedly in different contexts, they acquire them (52) ______.", "options": [{"id": "A", "text": "naturally"}, {"id": "B", "text": "forcefully"}, {"id": "C", "text": "hardly"}], "correct": "A", "id": 52, "explanation": "El contexto indica que la lectura libre permite adquirir vocabulario de manera org\u00e1nica y sin presiones, es decir, de manera 'natural' (naturally)."}, {"text": "CLOZE: Moreover, ER improves reading (53) ______ because students learn to process text faster.", "options": [{"id": "A", "text": "fluent"}, {"id": "B", "text": "fluency"}, {"id": "C", "text": "fluently"}], "correct": "B", "id": 53, "explanation": "Se requiere el sustantivo que corresponde al concepto de fluidez en la lectura. La forma correcta del sustantivo es 'fluency'."}, {"text": "CLOZE: It also exposes them to various sentence (54) ______, which improves their writing skills.", "options": [{"id": "A", "text": "structures"}, {"id": "B", "text": "shapes"}, {"id": "C", "text": "builds"}], "correct": "A", "id": 54, "explanation": "El t\u00e9rmino ling\u00fc\u00edstico para referirse a la organizaci\u00f3n gramatical de una oraci\u00f3n es 'sentence structures' (estructuras de las oraciones)."}, {"text": "CLOZE: However, implementing ER is not without challenges. Schools need to (55) ______ a well-stocked library.", "options": [{"id": "A", "text": "invest"}, {"id": "B", "text": "afford"}, {"id": "C", "text": "provide"}], "correct": "C", "id": 55, "explanation": "El verbo 'provide' significa proveer o proporcionar. Las escuelas necesitan 'proveer' una biblioteca bien surtida para que esta t\u00e9cnica funcione."}, {"text": "CLOZE: Teachers must also dedicate class time for silent reading, which (56) ______ be difficult in a tight curriculum.", "options": [{"id": "A", "text": "must"}, {"id": "B", "text": "can"}, {"id": "C", "text": "ought"}], "correct": "B", "id": 56, "explanation": "Se requiere el modal de posibilidad 'can', que en este contexto significa 'lo cual puede ser dif\u00edcil' (which can be difficult)."}, {"text": "CLOZE: Some teachers worry that without comprehension questions, they cannot (57) ______ if the students are actually reading.", "options": [{"id": "A", "text": "measure"}, {"id": "B", "text": "assure"}, {"id": "C", "text": "assess"}], "correct": "C", "id": 57, "explanation": "El verbo para referirse a la acci\u00f3n pedag\u00f3gica de medir o evaluar el progreso de comprensi\u00f3n del estudiante es 'assess'."}, {"text": "CLOZE: To solve this, teachers can ask students to keep a reading (58) ______ or give short oral reviews.", "options": [{"id": "A", "text": "log"}, {"id": "B", "text": "agenda"}, {"id": "C", "text": "registry"}], "correct": "A", "id": 58, "explanation": "Un registro continuo o diario donde los estudiantes anotan lo que han le\u00eddo se conoce com\u00fanmente en las aulas de ingl\u00e9s como un 'reading log'."}, {"text": "CLOZE: In conclusion, despite the challenges, ER is highly (59) ______.", "options": [{"id": "A", "text": "benefited"}, {"id": "B", "text": "beneficial"}, {"id": "C", "text": "benefit"}], "correct": "B", "id": 59, "explanation": "Se requiere un adjetivo que describa a la t\u00e9cnica de Extensive Reading como muy provechosa. El adjetivo correcto es 'beneficial'."}, {"text": "CLOZE: It is a powerful tool that every English teacher should (60) ______ incorporating into their syllabus.", "options": [{"id": "A", "text": "consider"}, {"id": "B", "text": "think"}, {"id": "C", "text": "regard"}], "correct": "A", "id": 60, "explanation": "El verbo 'consider' va seguido naturalmente de otro verbo con la terminaci\u00f3n '-ing'. 'Should consider incorporating' (deber\u00eda considerar incorporar)."}];
        
        let currentQuestionIndex = 0;
        let score = 0;
        let isLight = false;

        const quizContainer = document.getElementById('quiz-container');
        const quizArea = document.getElementById('quiz-area');
        const progressText = document.getElementById('progress-text');
        const feedbackArea = document.getElementById('feedback');
        const explanationBox = document.getElementById('explanation-box');
        const btnNext = document.getElementById('btn-next');
        const resultScreen = document.getElementById('result-screen');
        
        function toggleTheme() {
            isLight = !isLight;
            document.body.classList.toggle('light-theme', isLight);
            document.getElementById('theme-btn').innerText = isLight ? "🌙 Cambiar a Modo Oscuro" : "☀️ Cambiar a Modo Claro";
        }

        function toggleLanguage() {
            var iframe = document.getElementsByClassName('goog-te-banner-frame')[0];
            if(!iframe){
                window.location.hash = "googtrans(en|es)";
                location.reload();
            }
        }

        function renderQuestion() {
            const oldNodes = quizArea.querySelectorAll('.question-container');
            oldNodes.forEach(node => node.remove());
            
            feedbackArea.style.display = 'none';
            explanationBox.style.display = 'none';
            btnNext.style.display = 'none';

            progressText.innerText = `Pregunta ${currentQuestionIndex + 1} de ${questions.length}`;

            const q = questions[currentQuestionIndex];
            
            const qDiv = document.createElement('div');
            qDiv.className = 'question-container active';
            
            const qText = document.createElement('div');
            qText.className = 'question-text';
            qText.innerHTML = `<strong>Pregunta ${q.id}:</strong><br><br>` + q.text.replace(/\n/g, '<br>');
            qDiv.appendChild(qText);

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option';
                btn.innerHTML = `<strong>${String.fromCharCode(65 + index)})</strong> ${opt.text}`;
                btn.onclick = () => selectAnswer(btn, opt.id, q.correct, q.explanation);
                btn.dataset.id = opt.id;
                qDiv.appendChild(btn);
            });

            quizArea.appendChild(qDiv);
        }

        function selectAnswer(selectedBtn, selectedId, correctId, explanation) {
            const buttons = document.querySelectorAll('.option');
            buttons.forEach(btn => btn.disabled = true);

            if (selectedId === correctId) {
                selectedBtn.classList.add('correct');
                feedbackArea.textContent = '¡Correcto! ✔️';
                feedbackArea.className = 'feedback-correct';
                score++;
            } else {
                selectedBtn.classList.add('incorrect');
                const correctBtn = document.querySelector(`.option[data-id="${correctId}"]`);
                if (correctBtn) correctBtn.classList.add('correct');
                
                feedbackArea.textContent = `❌ Incorrecto. La alternativa correcta era la ${correctId}.`;
                feedbackArea.className = 'feedback-incorrect';
            }
            
            explanationBox.innerHTML = `<strong>💡 Explicación pedagógica:</strong><br>${explanation}`;
            explanationBox.style.display = 'block';

            feedbackArea.style.display = 'block';
            btnNext.style.display = 'block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                renderQuestion();
                window.scrollTo(0,0);
            } else {
                showResults();
            }
        }

        function showResults() {
            quizContainer.style.display = 'none';
            resultScreen.style.display = 'block';
            
            document.getElementById('final-score').textContent = `${score} / ${questions.length}`;
            
            let message = '';
            const percentage = score / questions.length;
            if (percentage >= 0.8) {
                message = '¡Extraordinario! Estás completamente lista para rendir tu examen de ascenso. ¡Confía en tus conocimientos!';
            } else if (percentage >= 0.6) {
                message = '¡Muy buen puntaje! Vas a ir muy segura al examen. Un último repaso a las explicaciones que fallaste y lo logras.';
            } else {
                message = 'El examen final requiere muchísima resistencia lectora y análisis. ¡No te rindas, sigue practicando!';
            }
            document.getElementById('final-message').textContent = message;
        }
        
        if(window.location.hash.includes("googtrans(en|es)")) {
            document.getElementById('lang-btn').innerText = "🔄 Restaurar a Inglés original";
            document.getElementById('lang-btn').onclick = function() {
                window.location.hash = "";
                location.reload();
            }
        }

        renderQuestion();
    </script>
</body>
</html>
