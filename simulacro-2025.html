<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulacro 2025 - Versión Oscura (Bilingüe + Retroalimentación)</title>
    <style>
        :root {
            /* Tema Oscuro (Defecto) */
            --bg-body: #121212;
            --bg-container: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #b0bec5;
            --btn-bg: #2c2c2c;
            --btn-border: #424242;
            --btn-hover: #3d3d3d;
            --primary: #00838f;
            --primary-hover: #006064;
            --correct-bg: #1b5e20;
            --correct-border: #2e7d32;
            --correct-text: #c8e6c9;
            --incorrect-bg: #b71c1c;
            --incorrect-border: #c62828;
            --incorrect-text: #ffcdd2;
            --explanation-bg: #263238;
            --explanation-border: #37474f;
            --explanation-text: #e0f7fa;
        }

        /* Tema Claro */
        body.light-theme {
            --bg-body: #f4f7f6;
            --bg-container: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --btn-bg: #f8f9fa;
            --btn-border: #dee2e6;
            --btn-hover: #e9ecef;
            --primary: #1a73e8;
            --primary-hover: #1557b0;
            --correct-bg: #d4edda;
            --correct-border: #c3e6cb;
            --correct-text: #155724;
            --incorrect-bg: #f8d7da;
            --incorrect-border: #f5c6cb;
            --incorrect-text: #721c24;
            --explanation-bg: #e3f2fd;
            --explanation-border: #bbdefb;
            --explanation-text: #0d47a1;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; transition: all 0.3s ease; }
        .container { background: var(--bg-container); max-width: 800px; width: 100%; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: all 0.3s ease; }
        
        .top-controls { display: flex; justify-content: space-between; margin-bottom: 20px; align-items: center;}
        .theme-btn, .lang-btn { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .theme-btn:hover, .lang-btn:hover { background: var(--primary-hover); }
        
        h1 { text-align: center; font-size: 26px; margin-bottom: 5px; }
        h2 { text-align: center; color: var(--text-muted); font-size: 16px; margin-top: 0; margin-bottom: 20px; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid var(--btn-border); padding-bottom: 10px;}
        .progress { font-size: 14px; color: var(--text-muted); font-weight: bold;}
        .exam-info { color: var(--primary); font-size: 14px; font-weight: bold; }
        
        /* Quiz */
        .question-container { display: none; }
        .question-container.active { display: block; }
        .question-text { font-size: 18px; line-height: 1.6; margin-bottom: 20px; font-weight: 500; text-align: justify; }
        
        .option { display: block; width: 100%; text-align: left; background: var(--btn-bg); border: 2px solid var(--btn-border); padding: 15px; margin-bottom: 12px; border-radius: 8px; cursor: pointer; font-size: 16px; transition: all 0.2s; line-height: 1.4; color: var(--text-main); }
        .option:hover { background: var(--btn-hover); }
        .option.correct { background: var(--correct-bg); border-color: var(--correct-border); color: var(--correct-text); pointer-events: none; }
        .option.incorrect { background: var(--incorrect-bg); border-color: var(--incorrect-border); color: var(--incorrect-text); pointer-events: none; }
        .option:disabled { cursor: default; opacity: 0.8;}
        
        #feedback { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; font-weight: bold; text-align: center; font-size: 18px;}
        .feedback-correct { background: var(--correct-bg); color: var(--correct-text); border: 1px solid var(--correct-border); }
        .feedback-incorrect { background: var(--incorrect-bg); color: var(--incorrect-text); border: 1px solid var(--incorrect-border); }
        
        /* Explanation Box */
        #explanation-box { margin-top: 15px; padding: 20px; border-radius: 8px; display: none; background: var(--explanation-bg); border: 1px solid var(--explanation-border); color: var(--explanation-text); font-size: 15px; line-height: 1.6; text-align: justify;}
        
        .btn-next { display: none; width: 100%; padding: 18px; margin-top: 25px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.2s;}
        .btn-next:hover { background: var(--primary-hover); }
        
        /* Result Screen */
        #result-screen { display: none; text-align: center; }
        .score { font-size: 54px; font-weight: bold; color: var(--primary); margin: 20px 0; }
        .btn-restart { background: var(--primary); color: white; border: none; border-radius: 8px; padding: 15px; width: 100%; font-size: 16px; font-weight: bold; cursor: margin-top: 30px;}
        .btn-restart:hover { background: var(--primary-hover);}
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Controls -->
        <div class="top-controls">
            <button class="theme-btn" onclick="toggleTheme()" id="theme-btn">☀️ Cambiar a Modo Claro</button>
            <button class="lang-btn" onclick="toggleLanguage()" id="lang-btn">🇬🇧 Leer en Español / English</button>
        </div>

        <h1 id="main-title">Simulacro 2025 Oficial</h1>
        <h2 id="sub-title">Ascenso EBR Secundaria - Inglés como Lengua Extranjera</h2>
        
        <div id="quiz-container">
            <div class="header-bar">
                <div class="exam-info" id="info-text">60 Preguntas (Formato Retroalimentado)</div>
                <div id="progress-text" class="progress"></div>
            </div>
            
            <div id="quiz-area">
                <!-- Questions injected here -->
            </div>
            
            <div id="feedback"></div>
            <div id="explanation-box"></div>
            
            <button id="btn-next" class="btn-next" onclick="nextQuestion()">Siguiente Pregunta</button>
        </div>

        <div id="result-screen">
            <h2 id="res-title">¡Examen Finalizado!</h2>
            <p id="res-desc">Has completado el Simulacro 2025. Tu puntaje final es:</p>
            <div class="score" id="final-score">0 / 0</div>
            <p id="final-message"></p>
            <button class="btn-restart" onclick="location.reload()" id="res-btn">Volver a intentar el simulacro</button>
        </div>
    </div>

    <!-- Cargar Google Translate Script de forma invisible para la traducción rápida del botón -->
    <div id="google_translate_element" style="display:none;"></div>
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'en', includedLanguages: 'es', autoDisplay: false}, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        const questions = [{"id": 1, "text": "A teachers' meeting regarding pedagogical management documents is being held... Which of the following teachers' comments aligns with those values?", "options": [{"id": "A", "text": "'The school should help the students with disabilities achieve similar performances...'"}, {"id": "B", "text": "'The school should ensure that the students with disabilities have the same opportunities to learn...'"}, {"id": "C", "text": "'The school should promote that the students with disabilities receive both specialized treatment...'"}], "correct": "B", "explanation": "La educaci\u00f3n inclusiva busca equiparar oportunidades y garantizar que todos los estudiantes, independientemente de sus capacidades, tengan las mismas oportunidades reales para aprender y participar (B)."}, {"id": 2, "text": "During a meeting about the implementation of universal design for learning (UDL)... 'When designing a learning session, it is necessary that the resources we use respond to the characteristics of our students...' Which of the following UDL principles is reflected in the suggestion above?", "options": [{"id": "A", "text": "Provide multiple means of engagement."}, {"id": "B", "text": "Provide multiple means of representation."}, {"id": "C", "text": "Provide multiple means of action and expression."}], "correct": "B", "explanation": "En el Dise\u00f1o Universal para el Aprendizaje (DUA), ofrecer materiales variados (texto, audio, video) responde directamente al principio de 'M\u00faltiples formas de representaci\u00f3n' (Provide multiple means of representation)."}, {"id": 3, "text": "A talk about the attention to people with disabilities is being held... 'To ensure that students with physical disabilities can enjoy the playground games, it is necessary to periodically maintain the ramps...' Which aligns with the inclusive approach?", "options": [{"id": "A", "text": "'...it will be easier for the students with physical disabilities to receive support from their peers...'"}, {"id": "B", "text": "'...the care of students with physical disabilities is being prioritized. By implementing it, we will help prevent accidents...'"}, {"id": "C", "text": "'...the proposal aims to create favorable conditions for the students with physical disabilities. This will help those students, as well as their peers, to freely enjoy the playground...'"}], "correct": "C", "explanation": "El enfoque inclusivo genuino se trata de crear entornos accesibles desde el inicio ('favorable conditions') para que todos puedan participar de forma aut\u00f3noma (C), en vez de depender de la ayuda constante o enfoques paternalistas (A o B)."}, {"id": 4, "text": "Alberto has noticed that some of his fourth-grade students write paragraphs that lack coherence... Which of the following activities is appropriate to achieve Alberto's purpose?", "options": [{"id": "A", "text": "The teacher pairs up the students and hands out a paragraph to each pair. The paragraph has missing punctuation marks and misspelled words..."}, {"id": "B", "text": "The teacher writes five pairs of simple sentences on the board. He pairs up the students and asks them to connect the sentences using conjunctions..."}, {"id": "C", "text": "The teacher pairs up the students and provides them with an envelope containing strips of paper with written sentences taken from a paragraph. He asks the students to put the strips in the correct order..."}], "correct": "C", "explanation": "La cohesi\u00f3n y coherencia se desarrollan al obligar al estudiante a encontrar la relaci\u00f3n l\u00f3gica entre oraciones mezcladas ('put strips in the correct order'), conectando as\u00ed el sentido del p\u00e1rrafo (C)."}, {"id": 5, "text": "Marlene's students are going to have a group discussion on the following question: 'What are some challenges the next generation will face?' She asks her students to use some of the following expressions: What's more... Not to mention that... You also have to consider... Which of the following language functions corresponds to the expressions Marlene wants her students to practice?", "options": [{"id": "A", "text": "Adding an argument."}, {"id": "B", "text": "Introducing a point of view."}, {"id": "C", "text": "Expressing degrees of certainty."}], "correct": "A", "explanation": "Frases como 'What's more' y 'You also have to consider' son conectores aditivos que se usan t\u00edpicamente en un discurso o debate para a\u00f1adir un nuevo argumento a la discusi\u00f3n (Adding an argument)."}, {"id": 6, "text": "Read the following situation: Emilio would like to work on his students' writing skills by using a blog entry about amazing experiences. After Emilio's students read the text, he would like them to scan some information. Which of the following set of questions is appropriate for this purpose?", "options": [{"id": "A", "text": "Is this experience happening now or in the past? Is Pedro's mother an adventurous person? Why? Who is Toni?"}, {"id": "B", "text": "Where was the holiday? Who is the blog's writer? What activities did they do?"}, {"id": "C", "text": "Did they have a good day? How did they feel doing the activities? Did they feel tired at the end of the day? Why?"}], "correct": "B", "explanation": "La t\u00e9cnica de 'scanning' consiste en buscar datos espec\u00edficos de manera r\u00e1pida sin leer todo el texto. Buscar nombres ('Who is Toni?'), lugares y respuestas cerradas (A) es un claro ejemplo de 'scanning'."}, {"id": 7, "text": "At the following stage of the lesson, Emilio wants his students to work on the intensifiers 'so' and 'such'... Which of the strategies Emilio has planned follows the inductive approach?", "options": [{"id": "A", "text": "The teacher writes, on the board, some of the sentences from the text that have the intensifiers 'so' and 'such.' Then he pairs up the students and asks them to share ideas about when and why those intensifiers are used..."}, {"id": "B", "text": "The teacher displays a piece of flipchart that contains some sentences with the intensifiers 'so' and 'such' and explains how to use them..."}, {"id": "C", "text": "The teacher gives the students a worksheet about the intensifiers 'such' and 'so.' In the worksheet, there are two examples of each intensifier and sentences with blanks..."}], "correct": "A", "explanation": "El enfoque inductivo (Inductive approach) implica que los estudiantes descubran la regla gramatical analizando ejemplos primero y deduciendo su uso, antes de que el docente la explique formalmente (A)."}, {"id": 8, "text": "Berenice is preparing her lesson for a reading session. She has noticed that the text for the next session is a recipe for a dish that is not popular in the students' community, so she has decided to make the text more meaningful for her students. Which of the following activities is more appropriate to carry out in order to achieve the teacher's purpose?", "options": [{"id": "A", "text": "The teacher adapts the text by deleting some words the students may find difficult to understand before she gives a copy of it to each student..."}, {"id": "B", "text": "The teacher brings pictures that show the ingredients for the recipe mentioned in the text and sticks the pictures on the board. Next, the teacher elicits the names..."}, {"id": "C", "text": "The teacher asks the students to read the text and answer the following questions: Have you ever tried this dish? Would you like to try it?..."}], "correct": "C", "explanation": "Para conectar con el estudiante y hacer la lectura 'significativa' (Meaningful), el docente debe vincular el tema del texto (receta extranjera) con las experiencias personales y gustos de los estudiantes antes de leer (C)."}, {"id": 9, "text": "During the past few sessions, Ursula's students have been talking about actions that started in the past but continue up to the present. During a semi-controlled group activity, she overhears a couple of students say: 'I have been to the movies last Saturday' and 'My mother has visited Piura last year'. Aware of the students' mistakes, Ursula wants to help her students correct their mistakes. Which of the following strategies is appropriate to carry out?", "options": [{"id": "A", "text": "The teacher makes a pause and draws a timeline on the board. Then she elicits examples of activities the students have done recently and writes them on the timeline..."}, {"id": "B", "text": "The teacher stops the activity for a moment. Then she asks the students to pay attention to their peers' sentences and try to identify when they make mistakes..."}, {"id": "C", "text": "The teacher approaches the students who have made mistakes and kindly explains to them how to use the target language correctly. After that, she gives the students some minutes to write..."}], "correct": "A", "explanation": "Corregir usando una l\u00ednea de tiempo (timeline) para contrastar visualmente el pasado y el presente es una t\u00e9cnica muy efectiva para que los alumnos entiendan por qu\u00e9 su uso del 'Present Perfect' con tiempos cerrados ('last Saturday') fue incorrecto (A)."}, {"id": 10, "text": "Amanda wants the students in her class to use the following expressions in a dialogue: I'd rather go to... It's very kind of you, but... Actually, I think I'm going to pass on it. Let me sleep on it. Which of the following language functions is Amanda trying to promote with the expressions above?", "options": [{"id": "A", "text": "Disagreeing with an opinion."}, {"id": "B", "text": "Expressing preference."}, {"id": "C", "text": "Rejecting an offer."}], "correct": "C", "explanation": "Expresiones como 'I'm going to pass on it' o 'Let me sleep on it' son maneras educadas e indirectas de declinar o rechazar una propuesta/oferta (Rejecting an offer)."}, {"id": 11, "text": "Josefina wants her fourth-grade students to improve their speaking skills through a class discussion. Which of the following teaching methods is NOT involved in Josefina's sequence?", "options": [{"id": "A", "text": "Presentation - Practice - Production."}, {"id": "B", "text": "Problem - Based Learning."}, {"id": "C", "text": "Task - Based Learning."}], "correct": "A", "explanation": "La secuencia de Josefina plantea un problema real ('Mi email fue hackeado, \u00bfqu\u00e9 har\u00edas?'), lo discuten y proponen soluciones. Esto usa 'Problem-Based' y 'Task-Based' learning. No hay presentaci\u00f3n gramatical directa ni ejercicios mec\u00e1nicos, por lo que NO es el m\u00e9todo PPP (A)."}, {"id": 12, "text": "Which of the following speaking skills is least promoted in Josefina's sequence?", "options": [{"id": "A", "text": "Communicating ideas fluently."}, {"id": "B", "text": "Using nonverbal and paraverbal sources."}, {"id": "C", "text": "Interacting with different speakers effectively."}], "correct": "B", "explanation": "Durante una discusi\u00f3n en grupos sobre un caso hipot\u00e9tico, los estudiantes interact\u00faan y fluyen. Lo que menos se eval\u00faa o promueve directamente en esta tarea espec\u00edfica es el uso consciente de recursos no verbales (posturas, miradas formales) t\u00edpico de exposiciones (B)."}, {"id": 13, "text": "In the teaching sequence, Josefina presents the following situation: 'Two weeks ago, my e-mail account was hacked...' What is Josefina's main purpose when presenting the situation above?", "options": [{"id": "A", "text": "Set the scene of the activity."}, {"id": "B", "text": "Promote the students' analysis of a situation."}, {"id": "C", "text": "Familiarize the students with language related to the topic."}], "correct": "B", "explanation": "El objetivo de contar la an\u00e9cdota personal sobre el hackeo no es la gram\u00e1tica, sino plantear el escenario (Set the scene) y generar el problema cognitivo que impulsar\u00e1 el debate posterior (B)."}, {"id": 14, "text": "In the teaching sequence, Josefina writes the following expressions on the board: It seems to me that... To my mind... As far as I understand... From my perspective... Which of the following language functions is she trying to promote with those expressions?", "options": [{"id": "A", "text": "Being vague."}, {"id": "B", "text": "Stating facts."}, {"id": "C", "text": "Expressing opinions."}], "correct": "C", "explanation": "Las frases 'It seems to me that', 'To my mind', y 'From my perspective' son expresiones est\u00e1ndar en ingl\u00e9s para dar una opini\u00f3n personal y subjetiva (Expressing opinions)."}, {"id": 15, "text": "Finally, Josefina wants to wrap-up her lesson. Which of the following activities is better to achieve the teacher's purpose?", "options": [{"id": "A", "text": "Tell the students to mention the most important things they have learned about e-mail hacking. Ask the students to share the solutions they consider more effective..."}, {"id": "B", "text": "Narrate the activities the students have done during the lesson so that they know the different steps they have followed. Mention the accomplished objectives..."}, {"id": "C", "text": "Ask the students to think of another experience of e-mail hacking they have heard or read about recently. Invite some of the students to share the experience..."}], "correct": "A", "explanation": "Una actividad de 'wrap-up' (cierre) ideal no es que el docente repita lo que hicieron, sino que los estudiantes sinteticen lo aprendido y eval\u00faen las soluciones de sus compa\u00f1eros, generando reflexi\u00f3n real (A)."}, {"id": 16, "text": "It is almost the end of the school year, so Gabriel wants his fifth-grade students to write a speech for their graduation ceremony. Before the students write their speeches, he asks them the following questions: Is a speech formal, semi-formal or informal? What sequence markers should you use to organize your speech?... What kind of questions is Gabriel using?", "options": [{"id": "A", "text": "Content checking questions."}, {"id": "B", "text": "Concept checking questions."}, {"id": "C", "text": "Instruction checking questions."}], "correct": "B", "explanation": "Las preguntas buscan asegurarse de que el estudiante entendi\u00f3 los conceptos te\u00f3ricos clave que deben aplicar en la redacci\u00f3n (registro, conectores). Por lo tanto, son 'Concept checking questions' (B)."}, {"id": 17, "text": "Leopoldo's third-grade students have been doing several listening comprehension exercises using an audio about two people discussing the pros and cons of allowing students to use cell phones in school. Now, Leopoldo wants his students to develop their critical thinking skills. Which of the following activities is least appropriate to achieve his purpose?", "options": [{"id": "A", "text": "The teacher asks the students to recognize how the speakers in the audio feel about the topic... The students have to support their answers using keywords from the audio."}, {"id": "B", "text": "The teacher asks the students to decide if the ideas about the use of cell phones in school mentioned by the speakers are evident in their school as well..."}, {"id": "C", "text": "The teacher asks the students to mention whether they agree or disagree with the speakers' arguments for and against the use of cell phones in school..."}], "correct": "A", "explanation": "El pensamiento cr\u00edtico exige an\u00e1lisis y opini\u00f3n. Identificar literalmente en el audio c\u00f3mo se sienten los hablantes buscando palabras clave (A) es una tarea de comprensi\u00f3n literal, no de desarrollo de pensamiento cr\u00edtico."}, {"id": 18, "text": "Margarita's students are going to participate in a school presentation about the importance of keeping streets clean... Margarita notices that her students hesitate quite often and start using Spanish fillers such as 'bueno' and 'este.' Thus, she wants to help her students sound more natural while they present their speeches. Which of the strategies below would be more appropriate for this purpose?", "options": [{"id": "A", "text": "Approach the students who use Spanish fillers in a sentence and gently provide them with a proper filler in English such as 'Well...,' 'I mean...,' 'You know...,' and some others..."}, {"id": "B", "text": "Write, on the board, some common fillers in English and tell the students they can use them whenever they forget how to continue an idea..."}, {"id": "C", "text": "Tell the students to avoid using fillers as they make them sound less fluent when speaking or talking to others. Also, give the students more time for them to practice as many times as necessary..."}], "correct": "B", "explanation": "Para evitar muletillas en espa\u00f1ol ('bueno', 'este'), la mejor estrategia formativa es proporcionarles sus equivalentes naturales en ingl\u00e9s ('Well...', 'I mean...') y escribirlas en la pizarra para que las integren en su discurso (B)."}, {"id": 19, "text": "Antonia's students are going to debate on the statement 'Junk food should be banned in schools.' She wants her students to use the following expressions while debating: I beg your pardon? Sorry to butt in, but... I don't quite see what you mean. Can I add something here? Which two language functions does Antonia want her students to practice?", "options": [{"id": "A", "text": "Apportioning blame / apologizing."}, {"id": "B", "text": "Asking for information / arranging one's ideas."}, {"id": "C", "text": "Expressing lack of understanding / interrupting someone."}], "correct": "C", "explanation": "Las frases 'I beg your pardon?' y 'I don't quite see what you mean' sirven para indicar que no se entendi\u00f3 (Expressing lack of understanding). 'Sorry to butt in' o 'Can I add...' sirven para interrumpir (interrupting someone)."}, {"id": 20, "text": "Tina's students have been talking about their favorite dish. Now, she wants them to participate in a communicative oral activity using that topic. Which of the following strategies is it more appropriate to carry out?", "options": [{"id": "A", "text": "The students write the recipe of their favorite dish in their notebooks. Next, they read it aloud to the whole class..."}, {"id": "B", "text": "The students record a video in which they give instructions to prepare their favorite dish. The teacher asks the students to use simple language..."}, {"id": "C", "text": "The students ask five peers what their favorite dish is, why they like it and what ingredients it is made of. Then they compare and analyze the answers they got..."}], "correct": "C", "explanation": "Una actividad comunicativa requiere interactuar para obtener informaci\u00f3n desconocida (information gap). Entrevistar a cinco compa\u00f1eros y comparar respuestas (C) genera este intercambio genuino."}, {"id": 21, "text": "During a reading session, Oswaldo's students are giving the text a first reading. While reading, a student raises his hand and asks the teacher for the meaning of the phrasal verb 'back up.' Which of the following actions is better for the teacher to carry out?", "options": [{"id": "A", "text": "Tell the student that, at this point, it is important to understand the general idea. Then point out that there will be a moment to check vocabulary as a whole class..."}, {"id": "B", "text": "Tell the student that the phrasal verb 'back up' is similar in meaning to 'support' or 'confirm,' but that it's more informal. Then give the student an example..."}, {"id": "C", "text": "Tell the student what a phrasal verb is and explain the meaning of 'back up' in English. If the student doesn't understand the meaning of that phrasal verb, translate it into Spanish..."}], "correct": "A", "explanation": "Interrumpir la primera lectura (que busca el sentido general o 'gist') para traducir un phrasal verb detiene el flujo cognitivo. El docente debe pedirle al alumno que espere a que termine la lectura global (A)."}, {"id": 22, "text": "Stefano's students are going to write a review of a movie they have seen recently. First, the teacher wants the students to get familiar with the elements of a movie review. Which of the following activities is most appropriate to achieve his purpose?", "options": [{"id": "A", "text": "The teacher groups the students and gives each group two samples of movie reviews and a chart with the following labels: title, genre, actors and director, music, photography, and plot..."}, {"id": "B", "text": "The teacher hands each student a copy of a word search puzzle that contains a list of words related to the elements of a movie review..."}, {"id": "C", "text": "The teacher pairs up the students and asks them to answer the following questions: 'What's a movie review?' and 'What elements does it have?' Then the teacher elicits the answers..."}], "correct": "A", "explanation": "La forma m\u00e1s efectiva y constructiva de familiarizarse con los elementos de un g\u00e9nero textual es darle a los estudiantes modelos reales ('samples') y pedirles que identifiquen sus partes completando un cuadro (A)."}, {"id": 23, "text": "Hugo's first-grade students are reading a short poem. Here is an excerpt of the poem: Up in the apple tree there is an apple so big and round... Climb up the tree and hold on tight Pick that round apple and take a big bite. Which of the following grammatical structures is the teacher mainly trying to promote with the poem?", "options": [{"id": "A", "text": "Adverbs."}, {"id": "B", "text": "Quantifiers."}, {"id": "C", "text": "Imperatives."}], "correct": "C", "explanation": "Verbos como 'Climb up', 'Hold on', 'Pick', y 'Take' presentados sin un sujeto al inicio de la frase son claramente \u00f3rdenes directas o instrucciones, conocidas en gram\u00e1tica como Imperativos (C)."}, {"id": 24, "text": "Marcelo's first-grade students are practicing a conversation in which they are sharing personal information... He notices that some students have difficulties pronouncing phonemes such as b/v, c/z, m/n, a/e, i/y, and so on when spelling words. He wants to help his students pronounce those phonemes better. Which of the following strategies is appropriate to achieve the teacher's purpose?", "options": [{"id": "A", "text": "Have the students use linking sounds."}, {"id": "B", "text": "Have the students recognize minimal pairs."}, {"id": "C", "text": "Have the students practice contrastive stress."}], "correct": "B", "explanation": "Para ayudar a distinguir y pronunciar fonemas similares que causan confusi\u00f3n (como b/v, c/z), la t\u00e9cnica fon\u00e9tica por excelencia es el uso de 'minimal pairs' (pares m\u00ednimos) (B)."}, {"id": 25, "text": "Victor's third-grade students have written a text in which they give advice to a friend. Now, the teacher is correcting the students' texts. Here is a comment he has written in one of the students' texts: 'This is a great text. You have included really useful pieces of advice to help your friend solve a problem. However, you could have used more of the expressions to give advice we studied in our previous sessions.' Based on the comment above, what was Victor's feedback focus?", "options": [{"id": "A", "text": "Organization."}, {"id": "B", "text": "Accuracy."}, {"id": "C", "text": "Range."}], "correct": "C", "explanation": "El profesor retroalimenta positivamente, pero se\u00f1ala que falt\u00f3 utilizar la variedad de expresiones gramaticales estudiadas previamente. Evaluar la riqueza y variedad estructural es evaluar el 'Range' (Rango) ling\u00fc\u00edstico (C)."}, {"id": 26, "text": "Romina wants to help her students develop their reading skills using the following text: Weekends at grandma's... Romina has thought of three different strategies to have her students work on the text. Which of the following strategies she has thought of belongs to the top-down processing?", "options": [{"id": "A", "text": "Group the students and provide each group with a set of cards. Each set of cards has some expressions from the text... Ask the groups to match each expression with a picture..."}, {"id": "B", "text": "Stick on the board some pictures related to the text. Ask the students to get in pairs and tell them to discuss what the story will be about based on those pictures. Then give each student a copy of the text..."}, {"id": "C", "text": "Write on the board a list of adjectives extracted from the text. Provide each student with a copy of the text with gaps in it to be filled with adjectives from the board..."}], "correct": "B", "explanation": "El procesamiento 'Top-down' implica usar el conocimiento general (im\u00e1genes, t\u00edtulos) para hacer hip\u00f3tesis sobre el texto antes de entrar a las palabras espec\u00edficas. Predecir a partir de im\u00e1genes (B) es 'Top-down'."}, {"id": 27, "text": "After the students have read the text, Romina wants them to understand the use of the transitions included in it. Which of the following strategies is more appropriate to carry out?", "options": [{"id": "A", "text": "The teacher writes, on the board, five incomplete sentences and under each sentence three possible transitions to complete that sentence. Next, in pairs, the students have some minutes to choose the correct answer..."}, {"id": "B", "text": "The teacher pairs up the students and provides each pair with a list of other transitions. Next, she asks the students to replace the transitions from the text with some of the words from the list..."}, {"id": "C", "text": "The teacher asks the students to circle all the transitions they see in the text. Then she pairs up the students and asks them to discuss what the purpose of each transition within sentences is..."}], "correct": "C", "explanation": "Para entender la funci\u00f3n de las transiciones (linking words), lo m\u00e1s profundo es pedirles que discutan qu\u00e9 prop\u00f3sito o relaci\u00f3n l\u00f3gica genera cada transici\u00f3n dentro de las oraciones del texto (C)."}, {"id": 28, "text": "Once the students have practiced different reading skills, Romina wants her students to work on a post-reading task. Which of the following activities is appropriate to achieve her purpose?", "options": [{"id": "A", "text": "Ask the students to think of some questions to know more information about the characters. Next, group the students and ask them to work together to come up with the possible answers..."}, {"id": "B", "text": "Stick a piece of flipchart paper with some expressions used to summarize information. Then pair up the students and ask them to say what the content of the text was by using some of the expressions provided..."}, {"id": "C", "text": "Write, on the board, some comprehension questions to be answered with information from the text. Ask the students to answer the questions individually. Group the students and tell them to compare their answers..."}], "correct": "A", "explanation": "Una tarea de 'post-reading' debe empujar la informaci\u00f3n m\u00e1s all\u00e1 del texto. Pedirles que generen nuevas preguntas sobre los personajes y que deduzcan colaborativamente las respuestas (A) es una excelente extensi\u00f3n."}, {"id": 29, "text": "Finally, Romina wants her students to work on an extensive task as homework. Which of the following tasks is appropriate to assign?", "options": [{"id": "A", "text": "The teacher asks the students to write a similar text, but using their own information. Also, she mentions that they have to include five or six linking words to connect their ideas..."}, {"id": "B", "text": "The teacher brings copies of a text about people visiting someone loved. The text has some blanks in it for the students to complete with words that fit the context of the text..."}, {"id": "C", "text": "The teacher encourages the students to read a brief text related to the topic. She points out that they can choose the text they prefer. In the following session, the students will say if they liked the text they read or not and explain why."}], "correct": "C", "explanation": "Una tarea 'extensiva' (Extensive reading) fomenta el h\u00e1bito lector por placer. Animar a los estudiantes a elegir libremente un texto corto relacionado al tema y opinar si les gust\u00f3 (C) cumple este objetivo."}, {"id": 30, "text": "Eulogio wants his third-grade students to infer information from the audio of a story. Which of the following activities develops that skill appropriately?", "options": [{"id": "A", "text": "Ask the students to pay attention to the expressions the characters used in the story. Encourage the students to say if the characters know each other and explain why."}, {"id": "B", "text": "Ask the students to take notes on the most important ideas included in the story. Encourage the students to write a summary including that information."}, {"id": "C", "text": "Ask the students to choose the moment from the story they liked or didn't like the most. Encourage the students to support their ideas."}], "correct": "A", "explanation": "Inferir significa sacar conclusiones basadas en evidencia indirecta. Deducir si los personajes se conocen a partir de la forma en que hablan y sus expresiones (A) es un trabajo puramente inferencial."}, {"id": 31, "text": "Mario wants his fourth-grade students to improve their reading skills... Mario tells the students to paraphrase, orally, the review of the microwave oven... Which one shows paraphrasing skills?", "options": [{"id": "A", "text": "Juan says: 'Jen is very mad at the company that sent her the product. I think the product is ugly and big so I wouldn't buy it...'"}, {"id": "B", "text": "Alicia says: 'Jen is really unhappy with a product. The product is large, horrible, weighty and not easy to operate. In general, it is not good value for money...'"}, {"id": "C", "text": "Lucia says: 'Jen is very disappointed with this product. It's big, awful, and very heavy so she can't carry it. It's also very difficult to use...'"}], "correct": "B", "explanation": "Parafrasear es mantener la idea original exacta (objetividad) pero usando vocabulario distinto. Alicia (B) relata todos los detalles (tama\u00f1o, peso, tardanza) usando sin\u00f3nimos formales sin a\u00f1adir suposiciones inventadas como lo hace Juan."}, {"id": 32, "text": "Mario wants his students to work on a meaningful extension activity in which they will write a product review. He has thought of three different activities. Which of the activities Mario has thought of is appropriate to achieve his purpose?", "options": [{"id": "A", "text": "The teacher brings cards with the name of different products in each one. He asks the students to randomly pick a card. After that, they write a review of the product."}, {"id": "B", "text": "The teacher gives the students a review of a product. He asks them to highlight the key words in it. Then they rewrite the review substituting the key words."}, {"id": "C", "text": "The teacher tells the students to think about the products they have at home. He asks them to choose one of those products. Next, they write a review of it."}], "correct": "C", "explanation": "Una tarea es significativa ('meaningful') cuando conecta con la realidad del alumno. Pedirles que escriban una rese\u00f1a sobre un electrodom\u00e9stico de sus propias casas (C) le da un prop\u00f3sito real y personal a la escritura."}, {"id": 33, "text": "Daniel's fourth-grade students are going to give an oral presentation about pollution effects in the environment. He provides the students with a list of expressions to be used during the presentation. Here are some of those expressions: I'd like to put the situation into some kind of perspective. I'd like you to think about the significance of this figure here... Which of the following language functions is involved in the expressions provided by the teacher?", "options": [{"id": "A", "text": "Highlighting information."}, {"id": "B", "text": "Introducing the topic."}, {"id": "C", "text": "Sequencing events."}], "correct": "A", "explanation": "Frases como 'I'd like to put the situation into some kind of perspective' y 'The significance of this figure...' sirven para resaltar y darle peso a un dato en una exposici\u00f3n (Highlighting information)."}, {"id": 34, "text": "Florencia wants her fourth-grade students to develop their listening skills using a radio spot in English of the Pan American and Parapan American Games 2019. Before listening to the radio spot, Florencia wants to activate her students' prior knowledge on the topic in a communicative way. Which of the following strategies is it appropriate to carry out?", "options": [{"id": "A", "text": "Bring a word search puzzle with some words related to the Pan American and Parapan American Games..."}, {"id": "B", "text": "Give each student a worksheet with a matching exercise about the Pan American and Parapan American Games..."}, {"id": "C", "text": "Write the title on the board. Provide the students with prompts such as: 'I think that...', 'Some sports played at this event are...', etc. Ask the students to stand up..."}], "correct": "C", "explanation": "Activar conocimientos previos de manera 'comunicativa' implica que los estudiantes interact\u00faen. Usar frases gu\u00eda ('prompts') para que dialoguen de pie con un compa\u00f1ero (C) es altamente comunicativo e interactivo."}, {"id": 35, "text": "Florencia asks her students to listen to the following radio spot... Then she asks the students to come up with a phrase or sentence that expresses what the audio is about. Which of the following listening skills is being developed through this activity?", "options": [{"id": "A", "text": "Listening for gist."}, {"id": "B", "text": "Predicting content."}, {"id": "C", "text": "Listening for details."}], "correct": "A", "explanation": "Sintetizar la idea central de todo un audio en una sola oraci\u00f3n o frase es la t\u00e9cnica para evaluar la comprensi\u00f3n de la esencia del mensaje (Listening for gist)."}, {"id": 36, "text": "Now, the students listen to the radio spot again and write down the sports mentioned in the audio. Which of the following listening skills is being developed through this activity?", "options": [{"id": "A", "text": "Paraphrasing."}, {"id": "B", "text": "Detecting connectors."}, {"id": "C", "text": "Listening for specific information."}], "correct": "C", "explanation": "Escuchar un audio por segunda vez con el \u00fanico objetivo de anotar palabras puntuales (la lista de deportes) es una cl\u00e1sica tarea de 'Listening for specific information' (C)."}, {"id": 37, "text": "Next, the teacher wants her students to work on a post-listening task to develop their speaking skills. Which of the following tasks is appropriate to achieve the teacher's purpose?", "options": [{"id": "A", "text": "Ask the students to record their own radio spot for a sports event in their community. Tell them to include some features of the spot they have just listened to..."}, {"id": "B", "text": "Play the radio spot again and ask the students to write as much information as possible in their notebooks. Tell them to use their notes to write a new version..."}, {"id": "C", "text": "Give each student a worksheet that contains the radio spot with some blanks in it. Ask the students to listen carefully and fill in the blanks..."}], "correct": "A", "explanation": "Una tarea 'post-listening' que busque desarrollar la expresi\u00f3n oral (speaking) debe obligar al estudiante a hablar. Grabar su propio anuncio de radio con su voz e intonaci\u00f3n (A) cumple directamente esta funci\u00f3n."}, {"id": 38, "text": "Fernanda's students are having a conversation in which they are using the following expressions: Hey, what happened? I swear I didn't mean to be late. Did you miss the bus or something? I hope you didn't wait for a long time. Which language function is NOT involved in the expressions provided?", "options": [{"id": "A", "text": "Asking for explanations."}, {"id": "B", "text": "Offering apologies."}, {"id": "C", "text": "Making promises."}], "correct": "C", "explanation": "Las frases dadas ('I swear I didn't mean to be late', 'I hope you didn't wait...') son excusas por una falta, pero ninguna constituye una promesa futura expl\u00edcita (Making promises)."}, {"id": 39, "text": "Alejandro's fifth-grade students are going to write a paragraph on 'The advantages and disadvantages of working out.' He wants his students to follow the process writing approach... Which writing stage has been best promoted in the sequence above?", "options": [{"id": "A", "text": "Planning."}, {"id": "B", "text": "Drafting."}, {"id": "C", "text": "Revising."}], "correct": "C", "explanation": "El 'Process Writing' tiene etapas claras. En este caso, el docente enfoc\u00f3 la tarea en que los alumnos intercambien, verifiquen el mensaje, la estructura y se den sugerencias mutuas, lo cual corresponde a la etapa de Revisi\u00f3n ('Revising')."}, {"id": 40, "text": "Marlon's students have been talking about movies using present perfect and simple past tenses. Now, he wants his students to develop their oral fluency in a freer way... While the students are working, the teacher monitors. When he notices a student makes a mistake, he corrects the student on the spot... Given the teacher's purpose, which of the following criticisms of this sequence is appropriate?", "options": [{"id": "A", "text": "The teacher shouldn't have corrected the students' mistakes while they were performing the task."}, {"id": "B", "text": "The teacher shouldn't have written, on the board, the mistakes the students made during the activity and elicited the correct form."}, {"id": "C", "text": "The teacher shouldn't have recycled vocabulary related to the topic and reminded the structures used to talk about recent past events."}], "correct": "A", "explanation": "En una actividad de fluidez oral (Free speaking fluency), el profesor debe monitorear y tomar notas sin interrumpir. Corregir el error 'on the spot' (en el acto) interrumpe la confianza y fluidez del alumno (A)."}, {"id": 41, "text": "Basilio wants his students to write a text about the places they can find in their towns using the task-based learning method. As a first step of the session... Which of the following purposes is mainly involved in Basilio's activity?", "options": [{"id": "A", "text": "Working on students' writing skills."}, {"id": "B", "text": "Familiarizing students with the topic."}, {"id": "C", "text": "Setting up the context of the activity."}], "correct": "B", "explanation": "El Task-Based Learning empieza con un 'Pre-task' para introducir vocabulario y contexto. Mostrar un video de pueblos y anotar lo que ven sirve para familiarizarlos con la tem\u00e1tica de la clase ('Familiarizing students with the topic')."}, {"id": 42, "text": "Now, for the while-task stage, Basilio's students are going to write their text. Which of the following activities is appropriate to carry out at this stage?", "options": [{"id": "A", "text": "Give each student a sample text describing a town. Ask the students to identify the elements found in the text..."}, {"id": "B", "text": "Ask the students to think about the places in their towns. Then give the students five minutes to write a paragraph describing those places..."}, {"id": "C", "text": "Have the students work in pairs and create a flyer about their town. Ask them to include information about what their towns have or don't have..."}], "correct": "C", "explanation": "En la fase 'While-task' los estudiantes deben crear un producto comunicativo de manera colaborativa. Hacer un 'flyer' sobre su propia ciudad en parejas y negociar la informaci\u00f3n (C) es el n\u00facleo de este m\u00e9todo."}, {"id": 43, "text": "During the post-task stage, Basilio collects his students' writings in order to provide feedback. Which of the following strategies displays reflective feedback?", "options": [{"id": "A", "text": "Give guiding comments such as 'Make sure the verb and noun agree in number,' 'What could be the best way to say this idea using plural?,' and some others..."}, {"id": "B", "text": "Focus on the positive characteristics of the writings to encourage and motivate the students. Use phrases such as 'Well done! You have included lots of interesting ideas'..."}, {"id": "C", "text": "Show the list of correction codes to the students and explain what they mean. Then mark all the grammar, vocabulary and spelling mistakes using these codes..."}], "correct": "A", "explanation": "La retroalimentaci\u00f3n reflexiva (Reflective feedback) no le da la respuesta al alumno, sino que le hace preguntas o le da pistas gramaticales ('Aseg\u00farate de que concuerde el n\u00famero') para que \u00e9l mismo descubra y corrija su error (A)."}, {"id": 44, "text": "Zaira's students are about to read the text 'The next wave of social media.' Before the students start reading, she wants to make sure they are familiar with key lexical items that appear in the text. Which of the following activities is most appropriate to carry out?", "options": [{"id": "A", "text": "The teacher writes, on the board, a list of words that will appear in the text and adds their meaning next to them. Then she reads the words aloud..."}, {"id": "B", "text": "The teacher pairs up the students. Next, she provides each pair with a worksheet in which there are words from the text that have some missing letters..."}, {"id": "C", "text": "The teacher sticks, on the walls, six pictures that depict vocabulary to understand the text. Then she gives each student some post-it notes for them to describe the pictures..."}], "correct": "C", "explanation": "La forma m\u00e1s l\u00fadica, deductiva y menos mec\u00e1nica de presentar vocabulario clave antes de leer, es usar im\u00e1genes y post-its para que los estudiantes deduzcan el concepto de manera colaborativa y visual (C)."}, {"id": 45, "text": "Roberto's fifth-grade students are going to design a timeline in pairs about their favorite singer's life... While monitoring, he overhears the following dialogue: Ana: Did you understand the teacher's instructions?... Which of the following language functions are the expressions in bold related to?", "options": [{"id": "A", "text": "Asking for repetition."}, {"id": "B", "text": "Clarifying information."}, {"id": "C", "text": "Summarizing information."}], "correct": "B", "explanation": "Cuando Ana dice 'If I got it right...' (Si entend\u00ed bien...) y 'Does it mean...' (\u00bfEso significa que...?), est\u00e1 intentando confirmar que comprendi\u00f3 bien las instrucciones, lo cual es 'Clarifying information' (B)."}, {"id": 46, "text": "CLOZE: The Buy Nothing movement. Social media, magazines, and shop windows (46) ______ people daily with things to buy...", "options": [{"id": "A", "text": "batter"}, {"id": "B", "text": "assault"}, {"id": "C", "text": "bombard"}], "correct": "C", "explanation": "La palabra 'bombard' (bombardear) es la colocaci\u00f3n idiom\u00e1tica correcta en ingl\u00e9s para expresar que uno recibe excesiva informaci\u00f3n o publicidad diaria."}, {"id": 47, "text": "CLOZE: ...while major brands offer (47) ______ cheap clothes that they can be treated like disposable items worn two or three times and then thrown away.", "options": [{"id": "A", "text": "so"}, {"id": "B", "text": "such"}, {"id": "C", "text": "enough"}], "correct": "A", "explanation": "La estructura intensificadora correcta seguida de la conjunci\u00f3n 'that' es 'so + adjective + that' (so cheap that). 'Such' requiere un sustantivo."}, {"id": 48, "text": "CLOZE: In Britain, the average person spends more than \u00a31,000 (48) ______ new clothes a year, which is around four per cent of their income.", "options": [{"id": "A", "text": "in"}, {"id": "B", "text": "on"}, {"id": "C", "text": "around"}], "correct": "B", "explanation": "El verbo 'spend' (gastar dinero o tiempo) siempre rige la preposici\u00f3n 'on'. Por tanto: 'spend money ON clothes'."}, {"id": 49, "text": "CLOZE: That might not sound like much, but that figure (49) ______ two far more worrying trends for society and for the environment.", "options": [{"id": "A", "text": "hides"}, {"id": "B", "text": "represses"}, {"id": "C", "text": "extinguishes"}], "correct": "A", "explanation": "El texto indica que esta cifra superficial en realidad oculta o enmascara (hides) problemas ambientales de fondo mucho m\u00e1s graves."}, {"id": 50, "text": "CLOZE: Also, not only are people spending money they don't have, (50) ______ they're using it to buy things they don't need.", "options": [{"id": "A", "text": "so"}, {"id": "B", "text": "but"}, {"id": "C", "text": "although"}], "correct": "B", "explanation": "La estructura correlativa completa es 'not only... but (also)'. Significa: 'No solo gastan lo que no tienen, SINO QUE (but) compran lo que no necesitan'."}, {"id": 51, "text": "CLOZE: People might not realize they are part of the disposable clothing problem (51) ______ they donate their unwanted clothes to charities.", "options": [{"id": "A", "text": "because of"}, {"id": "B", "text": "due to"}, {"id": "C", "text": "since"}], "correct": "C", "explanation": "El conector 'since' act\u00faa aqu\u00ed como una conjunci\u00f3n de causa (ya que / dado que), e introduce la oraci\u00f3n que explica el motivo psicol\u00f3gico del problema."}, {"id": 52, "text": "CLOZE: Huge quantities (52) ______ being thrown away, and a lot of clothes that charities can't sell are sent abroad...", "options": [{"id": "A", "text": "end up"}, {"id": "B", "text": "turn out"}, {"id": "C", "text": "result in"}], "correct": "A", "explanation": "El phrasal verb 'end up' (+ verbo con terminaci\u00f3n -ing) indica que algo termina o acaba inevitablemente de alguna forma ('end up being thrown away' = acaban siendo tiradas)."}, {"id": 53, "text": "CLOZE: However, a different trend is springing up in opposition to (53) ______ the 'buy nothing' trend.", "options": [{"id": "A", "text": "consuming"}, {"id": "B", "text": "consumption"}, {"id": "C", "text": "consumerism"}], "correct": "C", "explanation": "El sustantivo abstracto correcto que define la tendencia de comprar por comprar es 'consumerism' (consumismo)."}, {"id": 54, "text": "CLOZE: The idea originated in Canada in the early 1990s and then moved to the US, where it became a (54) ______ of the overspending and overconsumption of Black Friday...", "options": [{"id": "A", "text": "denial"}, {"id": "B", "text": "rejection"}, {"id": "C", "text": "contradiction"}], "correct": "B", "explanation": "La iniciativa de no comprar nada surgi\u00f3 como una respuesta y 'rechazo' (rejection) frontal a las pr\u00e1cticas consumistas del Black Friday."}, {"id": 55, "text": "CLOZE: On Buy Nothing Day people organize various types of protests and (55) ______ their credit cards.", "options": [{"id": "A", "text": "cut in"}, {"id": "B", "text": "cut up"}, {"id": "C", "text": "cut off"}], "correct": "B", "explanation": "El phrasal verb para romper algo en pedacitos (como tijeretear una tarjeta de cr\u00e9dito) es 'cut up'."}, {"id": 56, "text": "CLOZE: The trend (56) ______ influencers on social media who usually share posts of clothing and make-up that they recommend for people to buy.", "options": [{"id": "A", "text": "reaches"}, {"id": "B", "text": "reached"}, {"id": "C", "text": "has reached"}], "correct": "C", "explanation": "El uso del Present Perfect ('has reached') es adecuado porque la tendencia empez\u00f3 en el pasado y sus consecuencias (influenciar en redes) persisten hasta hoy."}, {"id": 57, "text": "CLOZE: Some YouTube stars now (57) ______ their viewers not to buy anything at all for periods as long as a year.", "options": [{"id": "A", "text": "encourage"}, {"id": "B", "text": "compel"}, {"id": "C", "text": "drive"}], "correct": "A", "explanation": "Los youtubers 'animan' o 'alientan' (encourage) a sus seguidores a imitar sus pr\u00e1cticas sostenibles. No pueden obligarlos legalmente (compel)."}, {"id": 58, "text": "CLOZE: For the next stage, they gave up services... In one year, they (58) ______ $55,000.", "options": [{"id": "A", "text": "had saved"}, {"id": "B", "text": "have saved"}, {"id": "C", "text": "have been saving"}], "correct": "A", "explanation": "Como la oraci\u00f3n est\u00e1 narrando un logro que ya se complet\u00f3 antes de otro momento en el pasado, se utiliza el Pasado Perfecto ('had saved' = hab\u00edan ahorrado)."}, {"id": 59, "text": "CLOZE: If everyone followed a similar plan, the results (59) ______ be impressive.", "options": [{"id": "A", "text": "will"}, {"id": "B", "text": "shall"}, {"id": "C", "text": "would"}], "correct": "C", "explanation": "Es un Segundo Condicional cl\u00e1sico (If + past simple, ... + would). Si todos siguieran (followed) este plan, el resultado 'ser\u00eda' (would be) impresionante."}, {"id": 60, "text": "CLOZE: Buy Nothing groups send a clear message to companies that people are no longer (60) ______ to accept the environmental and human cost of overconsumption.", "options": [{"id": "A", "text": "unsure"}, {"id": "B", "text": "willing"}, {"id": "C", "text": "reluctant"}], "correct": "B", "explanation": "La frase 'willing to' significa 'estar dispuesto a'. El mensaje del movimiento es que la gente ya no est\u00e1 dispuesta a aceptar el costo ambiental."}];
        
        let currentQuestionIndex = 0;
        let score = 0;
        let isLight = false;

        const quizContainer = document.getElementById('quiz-container');
        const quizArea = document.getElementById('quiz-area');
        const progressText = document.getElementById('progress-text');
        const feedbackArea = document.getElementById('feedback');
        const explanationBox = document.getElementById('explanation-box');
        const btnNext = document.getElementById('btn-next');
        const resultScreen = document.getElementById('result-screen');
        
        function toggleTheme() {
            isLight = !isLight;
            document.body.classList.toggle('light-theme', isLight);
            document.getElementById('theme-btn').innerText = isLight ? "🌙 Cambiar a Modo Oscuro" : "☀️ Cambiar a Modo Claro";
        }

        function toggleLanguage() {
            var iframe = document.getElementsByClassName('goog-te-banner-frame')[0];
            if(!iframe){
                window.location.hash = "googtrans(en|es)";
                location.reload();
            }
        }

        function renderQuestion() {
            const oldNodes = quizArea.querySelectorAll('.question-container');
            oldNodes.forEach(node => node.remove());
            
            feedbackArea.style.display = 'none';
            explanationBox.style.display = 'none';
            btnNext.style.display = 'none';

            progressText.innerText = `Pregunta ${currentQuestionIndex + 1} de ${questions.length}`;

            const q = questions[currentQuestionIndex];
            
            const qDiv = document.createElement('div');
            qDiv.className = 'question-container active';
            
            const qText = document.createElement('div');
            qText.className = 'question-text';
            qText.innerHTML = `<strong>Pregunta ${q.id}:</strong><br><br>` + q.text.replace(/\n/g, '<br>');
            qDiv.appendChild(qText);

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option';
                btn.innerHTML = `<strong>${String.fromCharCode(65 + index)})</strong> ${opt.text}`;
                btn.onclick = () => selectAnswer(btn, opt.id, q.correct, q.explanation);
                btn.dataset.id = opt.id;
                qDiv.appendChild(btn);
            });

            quizArea.appendChild(qDiv);
        }

        function selectAnswer(selectedBtn, selectedId, correctId, explanation) {
            const buttons = document.querySelectorAll('.option');
            buttons.forEach(btn => btn.disabled = true);

            if (selectedId === correctId) {
                selectedBtn.classList.add('correct');
                feedbackArea.textContent = '¡Correcto! ✔️';
                feedbackArea.className = 'feedback-correct';
                score++;
            } else {
                selectedBtn.classList.add('incorrect');
                const correctBtn = document.querySelector(`.option[data-id="${correctId}"]`);
                if (correctBtn) correctBtn.classList.add('correct');
                
                feedbackArea.textContent = `❌ Incorrecto. La alternativa correcta era la ${correctId}.`;
                feedbackArea.className = 'feedback-incorrect';
            }
            
            explanationBox.innerHTML = `<strong>💡 Explicación pedagógica:</strong><br>${explanation}`;
            explanationBox.style.display = 'block';

            feedbackArea.style.display = 'block';
            btnNext.style.display = 'block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                renderQuestion();
                window.scrollTo(0,0);
            } else {
                showResults();
            }
        }

        function showResults() {
            quizContainer.style.display = 'none';
            resultScreen.style.display = 'block';
            
            document.getElementById('final-score').textContent = `${score} / ${questions.length}`;
            
            let message = '';
            const percentage = score / questions.length;
            if (percentage >= 0.8) {
                message = '¡Excelente trabajo! Tienes dominado el enfoque del último examen del Minedu.';
            } else if (percentage >= 0.6) {
                message = '¡Muy bien! Un buen desempeño. Repasa las explicaciones de las fallas y listo.';
            } else {
                message = 'No te desanimes. Este examen requiere habituarse a la casuística. ¡La práctica hace al maestro!';
            }
            document.getElementById('final-message').textContent = message;
        }
        
        if(window.location.hash.includes("googtrans(en|es)")) {
            document.getElementById('lang-btn').innerText = "🔄 Restaurar a Inglés original";
            document.getElementById('lang-btn').onclick = function() {
                window.location.hash = "";
                location.reload();
            }
        }

        renderQuestion();
    </script>
</body>
</html>
