<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulacro 2023 - Versión Oscura (Bilingüe + Retroalimentación)</title>
    <style>
        :root {
            /* Tema Oscuro (Defecto) */
            --bg-body: #121212;
            --bg-container: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #b0bec5;
            --btn-bg: #2c2c2c;
            --btn-border: #424242;
            --btn-hover: #3d3d3d;
            --primary: #00838f;
            --primary-hover: #006064;
            --correct-bg: #1b5e20;
            --correct-border: #2e7d32;
            --correct-text: #c8e6c9;
            --incorrect-bg: #b71c1c;
            --incorrect-border: #c62828;
            --incorrect-text: #ffcdd2;
            --explanation-bg: #263238;
            --explanation-border: #37474f;
            --explanation-text: #e0f7fa;
        }

        /* Tema Claro */
        body.light-theme {
            --bg-body: #f4f7f6;
            --bg-container: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --btn-bg: #f8f9fa;
            --btn-border: #dee2e6;
            --btn-hover: #e9ecef;
            --primary: #1a73e8;
            --primary-hover: #1557b0;
            --correct-bg: #d4edda;
            --correct-border: #c3e6cb;
            --correct-text: #155724;
            --incorrect-bg: #f8d7da;
            --incorrect-border: #f5c6cb;
            --incorrect-text: #721c24;
            --explanation-bg: #e3f2fd;
            --explanation-border: #bbdefb;
            --explanation-text: #0d47a1;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; transition: all 0.3s ease; }
        .container { background: var(--bg-container); max-width: 800px; width: 100%; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: all 0.3s ease; }
        
        .top-controls { display: flex; justify-content: space-between; margin-bottom: 20px; align-items: center;}
        .theme-btn, .lang-btn { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .theme-btn:hover, .lang-btn:hover { background: var(--primary-hover); }
        
        h1 { text-align: center; font-size: 26px; margin-bottom: 5px; }
        h2 { text-align: center; color: var(--text-muted); font-size: 16px; margin-top: 0; margin-bottom: 20px; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid var(--btn-border); padding-bottom: 10px;}
        .progress { font-size: 14px; color: var(--text-muted); font-weight: bold;}
        .exam-info { color: var(--primary); font-size: 14px; font-weight: bold; }
        
        /* Quiz */
        .question-container { display: none; }
        .question-container.active { display: block; }
        .question-text { font-size: 18px; line-height: 1.6; margin-bottom: 20px; font-weight: 500; text-align: justify; }
        
        .option { display: block; width: 100%; text-align: left; background: var(--btn-bg); border: 2px solid var(--btn-border); padding: 15px; margin-bottom: 12px; border-radius: 8px; cursor: pointer; font-size: 16px; transition: all 0.2s; line-height: 1.4; color: var(--text-main); }
        .option:hover { background: var(--btn-hover); }
        .option.correct { background: var(--correct-bg); border-color: var(--correct-border); color: var(--correct-text); pointer-events: none; }
        .option.incorrect { background: var(--incorrect-bg); border-color: var(--incorrect-border); color: var(--incorrect-text); pointer-events: none; }
        .option:disabled { cursor: default; opacity: 0.8;}
        
        #feedback { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; font-weight: bold; text-align: center; font-size: 18px;}
        .feedback-correct { background: var(--correct-bg); color: var(--correct-text); border: 1px solid var(--correct-border); }
        .feedback-incorrect { background: var(--incorrect-bg); color: var(--incorrect-text); border: 1px solid var(--incorrect-border); }
        
        /* Explanation Box */
        #explanation-box { margin-top: 15px; padding: 20px; border-radius: 8px; display: none; background: var(--explanation-bg); border: 1px solid var(--explanation-border); color: var(--explanation-text); font-size: 15px; line-height: 1.6; text-align: justify;}
        
        .btn-next { display: none; width: 100%; padding: 18px; margin-top: 25px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.2s;}
        .btn-next:hover { background: var(--primary-hover); }
        
        /* Result Screen */
        #result-screen { display: none; text-align: center; }
        .score { font-size: 54px; font-weight: bold; color: var(--primary); margin: 20px 0; }
        .btn-restart { background: var(--primary); color: white; border: none; border-radius: 8px; padding: 15px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 30px;}
        .btn-restart:hover { background: var(--primary-hover);}
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Controls -->
        <div class="top-controls">
            <button class="theme-btn" onclick="toggleTheme()" id="theme-btn">☀️ Cambiar a Modo Claro</button>
            <button class="lang-btn" onclick="toggleLanguage()" id="lang-btn">🇬🇧 Leer en Español / English</button>
        </div>

        <h1 id="main-title">Simulacro 2023 Oficial</h1>
        <h2 id="sub-title">Ascenso EBR Secundaria - Inglés como Lengua Extranjera</h2>
        
        <div id="quiz-container">
            <div class="header-bar">
                <div class="exam-info" id="info-text">60 Preguntas (Formato Retroalimentado)</div>
                <div id="progress-text" class="progress"></div>
            </div>
            
            <div id="quiz-area">
                <!-- Questions injected here -->
            </div>
            
            <div id="feedback"></div>
            <div id="explanation-box"></div>
            
            <button id="btn-next" class="btn-next" onclick="nextQuestion()">Siguiente Pregunta</button>
        </div>

        <div id="result-screen">
            <h2 id="res-title">¡Examen Finalizado!</h2>
            <p id="res-desc">Has completado el Simulacro 2023. Tu puntaje final es:</p>
            <div class="score" id="final-score">0 / 0</div>
            <p id="final-message"></p>
            <button class="btn-restart" onclick="location.reload()" id="res-btn">Volver a intentar el simulacro</button>
        </div>
    </div>

    <!-- Cargar Google Translate Script de forma invisible para la traducción rápida del botón -->
    <div id="google_translate_element" style="display:none;"></div>
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'en', includedLanguages: 'es', autoDisplay: false}, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        const questions = [{"id": 1, "text": "Fernanda is a student that has physical disability and uses a wheelchair to move around. She is going to enroll in a new school next week. Therefore, the classroom teacher organizes an assembly to raise awareness of Fernanda's condition. During the assembly, three students are discussing the different ways in which they can help Fernanda move around the school. Which of the following students' comments is aligned to the Approach to Inclusive Education of the National Curriculum for Basic Education?", "options": [{"id": "A", "text": "\"To move Fernanda around, we have to take her in her wheelchair so that she can go with us wherever we go...\""}, {"id": "B", "text": "\"If we want to help Fernanda move around the school, we'd better ask her when she requires our help...\""}, {"id": "C", "text": "\"I consider it will be a good idea to keep an eye on Fernanda...\""}], "correct": "B", "explanation": "El enfoque Inclusivo busca fomentar la participaci\u00f3n y autonom\u00eda del estudiante. Preguntar directamente a Fernanda (opci\u00f3n B) fomenta su agencia en lugar de sobreprotegerla."}, {"id": 2, "text": "As part of the project \"I take care of my community,\" the students have identified different problems... Which of the following strategies is more appropriate to carry out?", "options": [{"id": "A", "text": "Tell the students to ask the neighbors what complaints they have..."}, {"id": "B", "text": "Discuss with the students the limitations that not being able to use the soccer field causes..."}, {"id": "C", "text": "Ask the students to be part of a plenary session to talk about the improvements..."}], "correct": "B", "explanation": "El enfoque de Derechos Humanos requiere reflexionar sobre c\u00f3mo la problem\u00e1tica afecta directamente la vida comunitaria y empodera a proponer soluciones c\u00edvicas (B)."}, {"id": 3, "text": "Brenda has asked the students to describe the furniture in their favorite room at home. After giving the instructions for the activity, one student asks, \"What does 'furniture' mean?\" and Brenda answers, \"Oh, tables and chairs are pieces of furniture.\" Which strategy for scaffolding students' understanding has Brenda used?", "options": [{"id": "A", "text": "Chunking."}, {"id": "B", "text": "Modeling."}, {"id": "C", "text": "Exemplification."}], "correct": "C", "explanation": "Exemplification: Dar ejemplos directos ('tables and chairs' en vez de una traducci\u00f3n o regla abstracta) ayuda al alumno a inferir el concepto de 'furniture' (muebles)."}, {"id": 4, "text": "Harold wants the students in his class to improve their cohesion in a written text through the use of discourse markers... Which of the following writing tasks will better help the students practice the use of discourse markers?", "options": [{"id": "A", "text": "A brief article about the importance of consuming local food. The students have to include convincing information..."}, {"id": "B", "text": "A list of the five most popular local food in the students' community..."}, {"id": "C", "text": "A poster encouraging people to consume local food more often..."}], "correct": "A", "explanation": "Redactar un art\u00edculo (A) requiere organizar ideas complejas en p\u00e1rrafos estructurados, donde el uso de conectores (discourse markers) es esencial para la cohesi\u00f3n, a diferencia de listas o afiches."}, {"id": 5, "text": "Dario wants his third-grade students to describe past events using the simple past tense, so he has planned a lesson using the Inductive Approach. Which of the following strategies is most appropriate to carry out?", "options": [{"id": "A", "text": "The teacher tells the students a well-known fairy tale emphasizing the past events..."}, {"id": "B", "text": "The teacher talks about the activities he did for fun when he was a child..."}, {"id": "C", "text": "The teacher asks the students to read a singer's biography and underline five sentences in simple past tense..."}], "correct": "C", "explanation": "En el enfoque inductivo (C), los estudiantes primero analizan un texto para identificar el uso gramatical y, guiados por el docente, deducen las reglas antes de aplicarlas en un texto propio."}, {"id": 6, "text": "Jaime has told the students to imagine they have to talk to a friend who is having trouble... Which of the following language functions promotes the use of the expressions provided?", "options": [{"id": "A", "text": "Reassuring someone."}, {"id": "B", "text": "Expressing concern."}, {"id": "C", "text": "Giving advice."}], "correct": "A", "explanation": "Las frases 'It'll turn out all right' o 'Take it easy' se utilizan para dar tranquilidad o confort emocional, conocido funcionalmente como 'Reassuring someone'."}, {"id": 7, "text": "Cesar's third-grade students have been talking about the best travel destinations... Which of the strategies Cesar has thought of is least communicative?", "options": [{"id": "A", "text": "Strategy 1: Ask the students to get in pairs and talk about a place they have visited..."}, {"id": "B", "text": "Strategy 2: Ask the students to give an oral presentation on the best places..."}, {"id": "C", "text": "Strategy 3: Ask the students to play the roles of a tourist and a journalist..."}], "correct": "B", "explanation": "La estrategia menos comunicativa es el mon\u00f3logo en forma de presentaci\u00f3n oral con escasas preguntas al final (B), ya que no fomenta una verdadera interacci\u00f3n din\u00e1mica."}, {"id": 9, "text": "Now, Marina wants the students to practice their skimming skills... Which of the following strategies is appropriate for Marina's purpose?", "options": [{"id": "A", "text": "She asks the students to read the text quickly in order to get the general idea..."}, {"id": "B", "text": "She asks the students to read the text carefully in order to answer some comprehension questions..."}, {"id": "C", "text": "She asks the students to read the text and circle the words they are not familiar with..."}], "correct": "A", "explanation": "Skimming consiste en una lectura r\u00e1pida de un texto para extraer la idea general ('gist'). Leer r\u00e1pidamente para entender el panorama (A) corresponde exactamente a esta t\u00e9cnica."}, {"id": 10, "text": "At another stage, Marina gives each student the following chart linking Activities and People's names. Then she gives her students the following instructions: \"Read the text again, and based on the information, decide which activity is best for each of the people presented in the text.\" Which reading skill is NOT promoted in the activity above?", "options": [{"id": "A", "text": "Ordering."}, {"id": "B", "text": "Scanning."}, {"id": "C", "text": "Inferring information."}], "correct": "A", "explanation": "En esta actividad, los estudiantes buscan informaci\u00f3n precisa (Scanning) y deducen respuestas (Inferring). No est\u00e1n secuenciando cronol\u00f3gicamente hechos, as\u00ed que 'Ordering' no se practica."}, {"id": 11, "text": "In the next activity, Marina groups the students and asks them to answer the following questions: Is a person's age relevant to learn English? Explain. What advice would you give the people in the text to learn English in a fun way? Which reading skill are the students in Marina's class working on?", "options": [{"id": "A", "text": "Contextualizing information from the text."}, {"id": "B", "text": "Reflecting on the content of the text."}, {"id": "C", "text": "Retrieving information from the text."}], "correct": "B", "explanation": "Emitir opiniones y brindar consejos requiere que el estudiante reflexione y conecte el texto con situaciones externas, un ejercicio de post-lectura de Reflexi\u00f3n (Reflecting on the content)."}, {"id": 12, "text": "Diana wants her fifth-grade students to develop stronger argumentation skills through a class discussion... Which of the following activities is more appropriate to assign the students as homework in order to help them develop stronger argumentation skills?", "options": [{"id": "A", "text": "Ask the students to rehearse presenting their arguments in order to gain confidence and fluency."}, {"id": "B", "text": "Ask the students to add extra arguments so that their ideas are more interesting and convincing."}, {"id": "C", "text": "Ask the students to look for evidence included in different sources of information and add it to their arguments."}], "correct": "C", "explanation": "El n\u00facleo de la argumentaci\u00f3n es el respaldo s\u00f3lido de las ideas. Buscar evidencia externa y a\u00f1adirla (C) ense\u00f1a que un argumento fuerte requiere investigaci\u00f3n y pruebas."}, {"id": 13, "text": "Consuelo's students are going to be speakers in their science school fair. She provides the students with the following expressions to be used during the event... Which of the following language functions DOES NOT correspond to the expressions presented above?", "options": [{"id": "A", "text": "Providing background."}, {"id": "B", "text": "Summarizing an idea."}, {"id": "C", "text": "Changing the topic."}], "correct": "B", "explanation": "Las frases dadas se refieren a estructurar un discurso y cambiar de t\u00f3pico ('Summarizing an idea' no encaja porque las frases sirven para iniciar un tema, no para cerrarlo)."}, {"id": 14, "text": "Manuela has asked the students in her class to role-play a situation in pairs. When Sheila and Joaquin are performing the role-play, Joaquin makes a grammar mistake, but Sheila understands what he means and continues with the activity. Which of the following actions is NOT appropriate to carry out after the role-play?", "options": [{"id": "A", "text": "Repeat Joaquin's sentence emphasizing the mistake and encourage him to say the correct form."}, {"id": "B", "text": "Give Joaquin a note including the mistake and its correct form so that he can be aware of the mistake."}, {"id": "C", "text": "Make a comment pointing out Joaquin's mistake, correct it and tell him to write a sentence using that form."}], "correct": "C", "explanation": "En un 'role-play' el objetivo principal es la fluidez y la comunicaci\u00f3n oral. Interrumpir para resaltar errores y pedir castigos escritos (C) es punitivo y corta la fluidez."}, {"id": 16, "text": "Once the students have finished planning their texts, Gabriela wants to give them some recommendations to write their first draft. Which of the following set of recommendations is appropriate to give at this stage of the writing process?", "options": [{"id": "A", "text": "\"Choose the most important ideas from your plan to be used as main ideas in each paragraph of your text...\""}, {"id": "B", "text": "\"Use all of the ideas from your plan to develop the texts of the essay...\""}, {"id": "C", "text": "\"Organize the information from the planning stage into sections. Pay attention to the grammar structures...\""}], "correct": "A", "explanation": "En la fase de 'drafting' (primer borrador), el \u00e9nfasis est\u00e1 en seleccionar las ideas principales y usar ejemplos o argumentos (A), antes de centrarse obsesivamente en gram\u00e1tica o incluir todas las ideas."}, {"id": 17, "text": "When the students finish writing the first version of their texts, Gabriela asks them to exchange their text with a peer in order to revise it. Which of the following aspects should be a focus of this first revision?", "options": [{"id": "A", "text": "Appropriate extension and organization of the paragraphs."}, {"id": "B", "text": "Use of varied words and accurate grammar structures."}, {"id": "C", "text": "Understanding and delivery of the message."}], "correct": "C", "explanation": "En la primera revisi\u00f3n entre pares, el objetivo es verificar si las ideas son coherentes, si el mensaje se transmite con claridad y el prop\u00f3sito se logr\u00f3 (C), dejando los detalles de ortograf\u00eda o gram\u00e1tica (Accuracy) para el final."}, {"id": 18, "text": "After the students have finished writing their essay, Gabriela wants them to reflect on the writing process they have gone through. Which of the following activities is least appropriate to carry out?", "options": [{"id": "A", "text": "The teacher sticks, on the board, a flipchart that shows the steps to write a text. She encourages the students to say aloud whether or not each of the steps was followed..."}, {"id": "B", "text": "The teacher asks the students to mention the steps they have followed during the writing process. From the steps mentioned, the students choose which step was the easiest or the most challenging..."}, {"id": "C", "text": "The teacher draws, on the board, three faces with different expressions: happy, sad and confused. She asks the students to choose the face that shows how they feel..."}], "correct": "A", "explanation": "Para reflexionar verdaderamente sobre el proceso, no basta con mirar una lista y decir si se hizo o no (A). El estudiante debe profundizar en lo que le result\u00f3 f\u00e1cil o dif\u00edcil emocional y cognitivamente."}, {"id": 20, "text": "Now, Keyla wants her students to develop their listening skill Inferring information. Which of the following questions is it more appropriate to ask in order to achieve Keyla's purpose?", "options": [{"id": "A", "text": "How does Stephanie feel about acting?"}, {"id": "B", "text": "How experienced is Stephanie at acting?"}, {"id": "C", "text": "How long has Stephanie worked non-stop?"}], "correct": "A", "explanation": "Inferir significa obtener conclusiones no expl\u00edcitas. Determinar c\u00f3mo se siente alguien leyendo entre l\u00edneas sobre sus respuestas (A) es un ejercicio de inferencia."}, {"id": 22, "text": "The students in Andrea's class are working on the text \"The future of technology.\" During one of the activities, Andrea notices that some students are having difficulty understanding the meaning of some words from the text. As a consequence, those students are taking longer to finish the activities planned. What should Andrea do to prevent this situation from happening again?", "options": [{"id": "A", "text": "Letting students use a bilingual dictionary."}, {"id": "B", "text": "Pre-teaching vocabulary."}, {"id": "C", "text": "Allowing extra time."}], "correct": "B", "explanation": "La preense\u00f1anza de vocabulario (Pre-teaching vocabulary) es clave antes de leer. Prepara a los estudiantes a lidiar con t\u00e9rminos dif\u00edciles que puedan detener la comprensi\u00f3n general del texto."}, {"id": 23, "text": "Josue has asked his fourth-grade students to bring some items to sell at the classroom market. He has planned a speaking activity where students use expressions like \"How much...?\", \"Could you make that...?\", \"That's a deal\". What are the two language functions involved in this speaking activity?", "options": [{"id": "A", "text": "Talking about prices and quantities / Using expressions to negotiate."}, {"id": "B", "text": "Requesting services / Asking and answering in a polite way."}, {"id": "C", "text": "Getting to know likes and dislikes / Requesting deeper information."}], "correct": "A", "explanation": "Estas frases (How much?, That's a deal) se usan de forma conversacional para discutir el precio, cantidades y negociar, funciones centrales en las transacciones comerciales cotidianas."}, {"id": 24, "text": "Marcia wants to involve her students in intensive listening tasks. She will use a short video recipe on how to make spaghetti. She has thought of the following listening tasks: Task 1: choose a favorite moment. Task 2: take notes of ingredients and amounts. Task 3: give an opinion about the recipe. Which of the listening tasks above is appropriate to achieve the teacher's purpose?", "options": [{"id": "A", "text": "Task 1."}, {"id": "B", "text": "Task 2."}, {"id": "C", "text": "Task 3."}], "correct": "B", "explanation": "El 'Intensive listening' implica una escucha meticulosa enfocada en la precisi\u00f3n. Tomar nota de las cantidades exactas y los ingredientes (Task 2) requiere alto detalle."}, {"id": 25, "text": "Rafael wanted to plan a communicative speaking assessment for his third-grade students using a dice game with weather words to build sentences like \"Today is cloudy\". Given Rafael's goal of designing a communicative speaking assessment, which of the following criticisms of this activity is appropriate?", "options": [{"id": "A", "text": "The activity provides limited speaking practice."}, {"id": "B", "text": "Game-like activities may not be used for speaking evaluation."}, {"id": "C", "text": "Students do not have enough vocabulary to build complete sentences."}], "correct": "A", "explanation": "Tirar un dado y crear oraciones sueltas ('Today is cloudy') no promueve un intercambio comunicativo real porque falta negociaci\u00f3n de significado y flujo conversacional (A)."}, {"id": 26, "text": "Carmelo's students have been talking about activities they used to do when they were younger, but they don't do anymore. Now, he wants them to participate in a discussion related to that topic using expressions like: \"I wouldn't want to do that again.\", \"That's a load off my mind.\", \"Phew! Thank goodness!\". Which of the following language functions is Carmelo trying to promote?", "options": [{"id": "A", "text": "Expressing disappointment."}, {"id": "B", "text": "Expressing annoyance."}, {"id": "C", "text": "Expressing relief."}], "correct": "C", "explanation": "Expresiones como 'That's a load off my mind' (Qu\u00e9 peso me quit\u00e9 de encima) o 'Thank goodness!' (\u00a1Menos mal!) se utilizan pragm\u00e1ticamente para denotar alivio (Expressing relief)."}, {"id": 27, "text": "Patricia wants the students in her class to get familiar with the topic of daily routines using the Lexical Approach. Which of the following strategies is it appropriate to carry out?", "options": [{"id": "A", "text": "The teacher gives each student a worksheet containing sentences that describe people's daily routines with a gap that should be filled in with a verb."}, {"id": "B", "text": "The teacher hands out each student an infographic that contains a famous person's routine. She asks them to read and identify collocations such as \"take a shower\". Then the students use those collocations to describe their own daily routines."}, {"id": "C", "text": "The teacher reads the students the story \"A day in my life.\" As she reads the story, she asks the students to raise their hands every time they hear an expression or phrase that describes a daily activity."}], "correct": "B", "explanation": "El Enfoque L\u00e9xico (Lexical Approach) sostiene que el idioma se aprende mejor en combinaciones de palabras naturales ('collocations' como 'take a shower') que a trav\u00e9s de palabras sueltas o reglas abstractas (B)."}, {"id": 28, "text": "Marcos has noticed that the English level of one of his students, Federico, is way higher than the rest of the class. As a result, he finishes all the writing tasks too soon and, of course, they are flawless. How should Marcos handle Federico's case?", "options": [{"id": "A", "text": "He can tell Federico to remain in silence and allow him to do something else."}, {"id": "B", "text": "He can plan a more challenging version of the writing tasks for Federico."}, {"id": "C", "text": "He can appoint Federico as secretary and let him assess his classmates' texts."}], "correct": "B", "explanation": "Un estudiante adelantado ('gifted learner') requiere diferenciaci\u00f3n curricular mediante tareas que aumenten el desaf\u00edo cognitivo (B). Usarlo de asistente docente (C) no atiende a sus necesidades de aprendizaje continuo."}, {"id": 29, "text": "Eulogio wants his third-grade students to infer information from the audio of a story. Which of the following activities develops that skill appropriately?", "options": [{"id": "A", "text": "Ask the students to pay attention to the expressions the characters used in the story. Encourage the students to say if the characters know each other and explain why."}, {"id": "B", "text": "Ask the students to take notes on the most important ideas included in the story. Encourage the students to write a summary including that information."}, {"id": "C", "text": "Ask the students to choose the moment from the story they liked or didn't like the most. Encourage the students to support their ideas."}], "correct": "A", "explanation": "Inferir requiere sacar conclusiones sobre situaciones que no est\u00e1n expl\u00edcitamente escritas, como predecir la relaci\u00f3n de los personajes seg\u00fan sus interacciones (A)."}, {"id": 30, "text": "Vanessa's students are going to read a text titled \"How to help your community\" and she wants to set a pre-reading task. In order to achieve this goal, which of the following tasks is appropriate?", "options": [{"id": "A", "text": "Have a discussion about the text."}, {"id": "B", "text": "Read the title, and predict the content of the text."}, {"id": "C", "text": "Scan new idiomatic expressions shown in the text."}], "correct": "B", "explanation": "Una t\u00e9cnica cl\u00e1sica de Pre-reading es 'Predicting'. Analizar t\u00edtulos y portadas para adivinar de qu\u00e9 va el texto activa esquemas cognitivos previos."}, {"id": 31, "text": "Camilo's students are going to listen to a short audio about candidates applying for different jobs. Before the students listen to the audio, the teacher shows flashcards, elicits job titles, asks students to discuss qualities needed, and tells them they will listen to an audio. Based on the activities presented, which stage of the lesson is Camilo developing?", "options": [{"id": "A", "text": "Lead-in."}, {"id": "B", "text": "Presentation."}, {"id": "C", "text": "Controlled practice."}], "correct": "A", "explanation": "Mostrar im\u00e1genes (flashcards) para despertar curiosidad y presentar l\u00e9xico antes de una tarea es una t\u00e9cnica de calentamiento ('Lead-in') que alista el contexto de aprendizaje."}, {"id": 32, "text": "Mario wants his fourth-grade students to do free writing about the topic \"Past experiences.\" Which of the following activities is it appropriate to carry out?", "options": [{"id": "A", "text": "Ask the students to write \"past experiences\" in the center of a piece of paper and add some ideas surrounding the phrase."}, {"id": "B", "text": "Ask the students to write the following questions: Who? What? Where? When? Why? And How? Tell the students to think about a past experience and answer those questions."}, {"id": "C", "text": "Ask the students to write some sentences about any past experience that comes to mind. Tell the students that they have to write as much as they can for ten minutes."}], "correct": "C", "explanation": "En el 'free writing', la instrucci\u00f3n fundamental es dejar fluir las ideas durante un tiempo ininterrumpido (C), sin pausas para evaluar gram\u00e1tica ni seguir estructuras r\u00edgidas."}, {"id": 33, "text": "Junior's students are going to read a text about technology. Before the students start reading the text, he wants to give an appropriate instruction for the first reading. What instruction should be given?", "options": [{"id": "A", "text": "\"Try to determine the main idea.\""}, {"id": "B", "text": "\"Focus on what kind of verbs are used.\""}, {"id": "C", "text": "\"Underline the new expressions displayed.\""}], "correct": "A", "explanation": "La primera lectura de cualquier texto siempre debe buscar entender la idea principal (Gist/Main idea), antes de pasar al nivel minucioso o de detalle."}, {"id": 35, "text": "Florencia asks her students to listen to the radio spot... Then she asks the students to come up with a phrase or sentence that expresses what the audio is about. Which of the following listening skills is being developed through this activity?", "options": [{"id": "A", "text": "Listening for gist."}, {"id": "B", "text": "Predicting content."}, {"id": "C", "text": "Listening for details."}], "correct": "A", "explanation": "Pedir al estudiante que sintetice la tem\u00e1tica central en una oraci\u00f3n es una tarea de comprensi\u00f3n general (Listening for gist)."}, {"id": 36, "text": "Now, the students listen to the radio spot again and write down the sports mentioned in the audio. Which of the following listening skills is being developed through this activity?", "options": [{"id": "A", "text": "Paraphrasing."}, {"id": "B", "text": "Detecting connectors."}, {"id": "C", "text": "Listening for specific information."}], "correct": "C", "explanation": "Escuchar para captar nombres espec\u00edficos (en este caso, qu\u00e9 deportes se nombran) corresponde a la habilidad de 'Listening for specific information'."}, {"id": 37, "text": "Next, the teacher wants her students to work on a post-listening task to develop their speaking skills. Which of the following tasks is appropriate to achieve the teacher's purpose?", "options": [{"id": "A", "text": "Ask the students to record their own radio spot for a sports event in their community. Tell them to include some features of the spot they have just listened to..."}, {"id": "B", "text": "Play the radio spot again and ask the students to write as much information as possible in their notebooks. Tell them to use their notes to write a new version..."}, {"id": "C", "text": "Give each student a worksheet that contains the radio spot with some blanks in it. Ask the students to listen carefully and fill in the blanks..."}], "correct": "A", "explanation": "Una tarea de 'post-listening' que intente desarrollar 'speaking' (producci\u00f3n oral) debe implicar que los estudiantes hablen (grabar un spot de radio, A). Escribir notas o llenar espacios desarrolla Writing."}, {"id": 38, "text": "Read the following teaching sequence: The students look at some flashcards. The teacher gives a short dialogue to read. The teacher asks them to repeat the dialogue twice after him/her. Finally, the students read aloud the conversation in pairs. Why is this teaching sequence inappropriate to develop speaking?", "options": [{"id": "A", "text": "It requires more pronunciation practice."}, {"id": "B", "text": "It does not have a presentation stage."}, {"id": "C", "text": "It lacks a production stage."}], "correct": "C", "explanation": "El modelo pedag\u00f3gico requiere Producci\u00f3n ('Production') libre. Leer y repetir un texto ajeno previene que los alumnos apliquen de manera aut\u00f3noma lo aprendido."}, {"id": 39, "text": "Victor wants his students to practice the speaking skill of communicating ideas fluently through the topic \"My daily routine.\" Which of the following activities is most appropriate to carry out?", "options": [{"id": "A", "text": "The teacher asks the students to stand up and mingle. In pairs, one student describes her daily routine and the other asks follow-up questions, then they exchange roles."}, {"id": "B", "text": "The teacher asks the students to interview a classmate on everyday activities and write down the answers in their notebooks. Then they prepare a short oral report."}, {"id": "C", "text": "The teacher asks the students to make a list of the activities they do every day. Then some volunteers read their lists to the rest of the class."}], "correct": "A", "explanation": "Una actividad comunicativa (mingle activity) donde los estudiantes intercambian preguntas libremente en parejas y luego cambian de pareja, fomenta significativamente la fluidez oral."}, {"id": 40, "text": "Kevin has prepared the reading material for his second-grade class which includes the fable titled \"The tortoise and the hare.\" After having worked on different reading tasks, Kevin wants his students to think critically on the text. Given this goal, which of the following questions is appropriate?", "options": [{"id": "A", "text": "What is the main topic of the fable?"}, {"id": "B", "text": "Where did the hare finally take a nap?"}, {"id": "C", "text": "Why do you think the tortoise never gave up running?"}], "correct": "C", "explanation": "El pensamiento cr\u00edtico en lectura exige ir m\u00e1s all\u00e1 de la recuperaci\u00f3n literal ('Why do you think...?'). Preguntar la raz\u00f3n moral por la que la tortuga continu\u00f3 desaf\u00eda al estudiante a analizar profundamente."}, {"id": 41, "text": "Which of the following sets of strategies is the most appropriate to develop the language function \"Introducing people\" through speaking?", "options": [{"id": "A", "text": "The students watch a video... write down the conversation... complete some related conversations in the book... practice one of the conversations... present to the class."}, {"id": "B", "text": "The teacher shows a picture... explains on the board the structure This is + person's name... writes examples... students complete blanks in a worksheet... present to the class."}, {"id": "C", "text": "The teacher shows flashcards... shows a model conversation on the board... asks which expressions are used... students practice the conversation using gestures and real names... act out the conversation."}], "correct": "C", "explanation": "El enfoque ideal proporciona exposici\u00f3n, pr\u00e1ctica controlada de forma reflexiva y termina en pr\u00e1ctica aut\u00e9ntica (juego de roles con 'real names' en C)."}, {"id": 42, "text": "The school year is almost starting so Yola is reviewing the syllabus for the first two months. She identifies the grammar structures she will work on and associates each one to a function: 'Talking about location' -> Prepositions. 'Giving directions' -> Yes-no questions with modals. 'Making suggestions' -> Why don't we, What about. Unfortunately, she has made one mistake. Which of the structures in Yola's notes have been associated to the wrong function?", "options": [{"id": "A", "text": "Prepositions (in, on, under, next, between, at)."}, {"id": "B", "text": "Yes-no questions with modals (may, could, would)."}, {"id": "C", "text": "Why don't we (+ base form verb), What about (+ -ing)?"}], "correct": "B", "explanation": "Las preguntas de s\u00ed/no con verbos modales ('Can I...?', 'Would you...?') se utilizan primariamente para pedir permiso o solicitar acciones, no para 'Dar direcciones' o ubicaciones espaciales en la calle."}, {"id": 43, "text": "Read the following situation: Rommy's students have written a text about \"The pros and cons of social networks.\" Before collecting the texts, Rommy wants her students to do a final revision focused on three criteria. Criterion 1: vocabulary is appropriate. Criterion 2: linking words have been used properly. Criterion 3: topic is well developed and sentences support it adequately. Which criterion promotes the revision of cohesion?", "options": [{"id": "A", "text": "Criterion 1."}, {"id": "B", "text": "Criterion 2."}, {"id": "C", "text": "Criterion 3."}], "correct": "B", "explanation": "La 'Cohesi\u00f3n' es la propiedad del texto que garantiza que las ideas est\u00e9n conectadas estructuralmente de forma adecuada mediante conectores y conjunciones (linking words)."}, {"id": 44, "text": "Which criterion promotes the revision of coherence?", "options": [{"id": "A", "text": "Criterion 1."}, {"id": "B", "text": "Criterion 2."}, {"id": "C", "text": "Criterion 3."}], "correct": "C", "explanation": "La 'Coherencia' es la relaci\u00f3n l\u00f3gica general del texto y si responde al prop\u00f3sito de manera comprensible. Evaluar que las oraciones apoyen el tema central es evaluar la coherencia."}, {"id": 45, "text": "Ruben's students are learning how to introduce people for the first time. Even though they still make mistakes, they seem to be really motivated. Which of the following alternatives best describes the learning stage Ruben's students have reached?", "options": [{"id": "A", "text": "Unconscious incompetence: the student does not know or understand how to use the language function and does not know it exists."}, {"id": "B", "text": "Conscious competence: the student has mastered the language function and the skill appears easily while performing others."}, {"id": "C", "text": "Conscious incompetence: the student knows the language function exists (though he does not know or understand how to use it) and values it as a learning tool."}], "correct": "C", "explanation": "Cuando un estudiante ya conoce la regla (sabe que existe) pero a\u00fan le cuesta aplicarla fluidamente sin errores, se dice que est\u00e1 en una etapa de 'Conscious incompetence'."}, {"id": 46, "text": "CLOZE: Read the following text excerpt and complete the blanks with the best option. Work-life balance. Ronan: I work in a (46) ______ traditional office environment doing a typical nine-to-five job.", "options": [{"id": "A", "text": "fairly"}, {"id": "B", "text": "extremely"}, {"id": "C", "text": "constantly"}], "correct": "A", "explanation": "El adverbio 'fairly' (bastante/razonablemente) completa la descripci\u00f3n natural de un ambiente tradicional en un trabajo convencional."}, {"id": 47, "text": "CLOZE: I like my job, but it's annoying that my commute to work takes an hour and a half each way and most of my work could really be (47) ______ online from home.", "options": [{"id": "A", "text": "done"}, {"id": "B", "text": "started"}, {"id": "C", "text": "explained"}], "correct": "A", "explanation": "El verbo 'do' en pasivo ('could be done') es la collocation natural en ingl\u00e9s para el trabajo o las tareas."}, {"id": 48, "text": "CLOZE: But my boss doesn't seem to trust (48) ______ we will get any work done if left to our own devices...", "options": [{"id": "A", "text": "where"}, {"id": "B", "text": "which"}, {"id": "C", "text": "that"}], "correct": "C", "explanation": "La frase 'trust that' es el conector que introduce una cl\u00e1usula nominal en ingl\u00e9s. Significa 'confiar en que...'."}, {"id": 49, "text": "CLOZE: It's frustrating that they feel the need to monitor what we do so (49) ______ instead of judging us based on our task performance, like most companies do these days.", "options": [{"id": "A", "text": "nearly"}, {"id": "B", "text": "closely"}, {"id": "C", "text": "promptly"}], "correct": "B", "explanation": "La frase idiom\u00e1tica para monitorear de cerca y exhaustivamente algo es 'monitor closely'."}, {"id": 50, "text": "CLOZE: Jo: I used to do a typical five-day week, but I wanted to spend more time with my children before they start school... After negotiating with him, we decided to cut my working week (50) ______ to a three-day work week.", "options": [{"id": "A", "text": "in"}, {"id": "B", "text": "up"}, {"id": "C", "text": "down"}], "correct": "C", "explanation": "El phrasal verb para reducir una cantidad (en este caso las horas o d\u00edas de trabajo) es 'cut down'."}, {"id": 51, "text": "CLOZE: I've noticed, though, that my workload (51) ______ decreased in the slightest!", "options": [{"id": "A", "text": "didn't"}, {"id": "B", "text": "hasn't"}, {"id": "C", "text": "hadn't"}], "correct": "B", "explanation": "Se usa el Present Perfect negativo ('hasn't decreased') porque el impacto o la falta del mismo en la carga de trabajo contin\u00faa en el presente."}, {"id": 52, "text": "CLOZE: (52) ______ I find myself having to take work home just so that I can meet the deadlines.", "options": [{"id": "A", "text": "On the contrary"}, {"id": "B", "text": "Even though"}, {"id": "C", "text": "Despite"}], "correct": "A", "explanation": "Se usa 'On the contrary' (Al contrario) para se\u00f1alar una oposici\u00f3n fuerte entre la expectativa (menos d\u00edas de trabajo = menos trabajo) y la realidad (sigue llevando trabajo a casa)."}, {"id": 53, "text": "CLOZE: It's wearing me out trying to juggle work with (53) ______ my family.", "options": [{"id": "A", "text": "taking up"}, {"id": "B", "text": "looking after"}, {"id": "C", "text": "bringing along"}], "correct": "B", "explanation": "El phrasal verb para 'cuidar' en ingl\u00e9s, referente a los ni\u00f1os o a la familia, es 'looking after'."}, {"id": 54, "text": "CLOZE: Martina: I work for a global IT company, but (54) ______ their headquarters is in the States, I do all my work online from home.", "options": [{"id": "A", "text": "because"}, {"id": "B", "text": "due to"}, {"id": "C", "text": "thus"}], "correct": "A", "explanation": "La conjunci\u00f3n causal 'because' introduce la cl\u00e1usula dependiente de la raz\u00f3n (su sede est\u00e1 en USA, por tanto trabaja remoto)."}, {"id": 55, "text": "CLOZE: That means that I don't waste time (55) ______ or making idle chit-chat with colleagues.", "options": [{"id": "A", "text": "transferring"}, {"id": "B", "text": "commuting"}, {"id": "C", "text": "going"}], "correct": "B", "explanation": "El verbo que describe espec\u00edficamente viajar habitualmente al lugar de trabajo y volver es 'commuting'."}, {"id": 56, "text": "CLOZE: I work on a project basis, and this flexibility is very valuable to me because it means that I can easily take some time off if I need to (56) ______ an appointment with the dentist.", "options": [{"id": "A", "text": "call"}, {"id": "B", "text": "separate"}, {"id": "C", "text": "schedule"}], "correct": "C", "explanation": "La combinaci\u00f3n correcta ('collocation') para planificar una cita m\u00e9dica en ingl\u00e9s es 'schedule an appointment'."}, {"id": 57, "text": "CLOZE: Leo: I'm a freelancer and work for myself... At first, I was working from home, but I found it really hard to concentrate because there were just (57) ______ distractions around.", "options": [{"id": "A", "text": "many"}, {"id": "B", "text": "much"}, {"id": "C", "text": "a lot"}], "correct": "A", "explanation": "El sustantivo 'distractions' es contable y plural, por lo que exige el uso del cuantificador plural 'many'."}, {"id": 58, "text": "CLOZE: (58) ______ I started to go to a nearby caf\u00e9 to work, but the Wi-Fi connection wasn't ideal and I found myself drinking too much coffee.", "options": [{"id": "A", "text": "For instance"}, {"id": "B", "text": "Although"}, {"id": "C", "text": "Thus"}], "correct": "C", "explanation": "Se requiere un conector de consecuencia l\u00f3gica (Por consiguiente/As\u00ed que), y 'Thus' cumple esa funci\u00f3n gramatical formal."}, {"id": 59, "text": "CLOZE: In the end, I decided to rent a desk in a co-working space with five other freelancers like (59) ______. I liked getting dressed to go to work in the morning and being able to focus in an office environment.", "options": [{"id": "A", "text": "myself"}, {"id": "B", "text": "herself"}, {"id": "C", "text": "yourself"}], "correct": "A", "explanation": "Como se refiere a 'ella misma' (la autora), usa el pronombre reflexivo de la primera persona: 'myself'."}, {"id": 60, "text": "CLOZE: The other freelancers do similar kinds of web-based work to me and so it's nice to have workmates to bounce ideas (60) ______ as well.", "options": [{"id": "A", "text": "back"}, {"id": "B", "text": "into"}, {"id": "C", "text": "off"}], "correct": "C", "explanation": "El phrasal verb correcto para intercambiar ideas en grupo de forma colaborativa es 'bounce ideas off'."}];
        
        let currentQuestionIndex = 0;
        let score = 0;
        let isLight = false;

        const quizContainer = document.getElementById('quiz-container');
        const quizArea = document.getElementById('quiz-area');
        const progressText = document.getElementById('progress-text');
        const feedbackArea = document.getElementById('feedback');
        const explanationBox = document.getElementById('explanation-box');
        const btnNext = document.getElementById('btn-next');
        const resultScreen = document.getElementById('result-screen');
        
        function toggleTheme() {
            isLight = !isLight;
            document.body.classList.toggle('light-theme', isLight);
            document.getElementById('theme-btn').innerText = isLight ? "🌙 Cambiar a Modo Oscuro" : "☀️ Cambiar a Modo Claro";
        }

        function toggleLanguage() {
            var iframe = document.getElementsByClassName('goog-te-banner-frame')[0];
            if(!iframe){
                window.location.hash = "googtrans(en|es)";
                location.reload();
            }
        }

        function renderQuestion() {
            const oldNodes = quizArea.querySelectorAll('.question-container');
            oldNodes.forEach(node => node.remove());
            
            feedbackArea.style.display = 'none';
            explanationBox.style.display = 'none';
            btnNext.style.display = 'none';

            progressText.innerText = `Pregunta ${currentQuestionIndex + 1} de ${questions.length}`;

            const q = questions[currentQuestionIndex];
            
            const qDiv = document.createElement('div');
            qDiv.className = 'question-container active';
            
            const qText = document.createElement('div');
            qText.className = 'question-text';
            qText.innerHTML = `<strong>Pregunta ${q.id}:</strong><br><br>` + q.text.replace(/\n/g, '<br>');
            qDiv.appendChild(qText);

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option';
                btn.innerHTML = `<strong>${String.fromCharCode(65 + index)})</strong> ${opt.text}`;
                btn.onclick = () => selectAnswer(btn, opt.id, q.correct, q.explanation);
                btn.dataset.id = opt.id;
                qDiv.appendChild(btn);
            });

            quizArea.appendChild(qDiv);
        }

        function selectAnswer(selectedBtn, selectedId, correctId, explanation) {
            const buttons = document.querySelectorAll('.option');
            buttons.forEach(btn => btn.disabled = true);

            if (selectedId === correctId) {
                selectedBtn.classList.add('correct');
                feedbackArea.textContent = '¡Correcto! ✔️';
                feedbackArea.className = 'feedback-correct';
                score++;
            } else {
                selectedBtn.classList.add('incorrect');
                const correctBtn = document.querySelector(`.option[data-id="${correctId}"]`);
                if (correctBtn) correctBtn.classList.add('correct');
                
                feedbackArea.textContent = `❌ Incorrecto. La alternativa correcta era la ${correctId}.`;
                feedbackArea.className = 'feedback-incorrect';
            }
            
            explanationBox.innerHTML = `<strong>💡 Explicación pedagógica:</strong><br>${explanation}`;
            explanationBox.style.display = 'block';

            feedbackArea.style.display = 'block';
            btnNext.style.display = 'block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                renderQuestion();
                window.scrollTo(0,0);
            } else {
                showResults();
            }
        }

        function showResults() {
            quizContainer.style.display = 'none';
            resultScreen.style.display = 'block';
            
            document.getElementById('final-score').textContent = `${score} / ${questions.length}`;
            
            let message = '';
            const percentage = score / questions.length;
            if (percentage >= 0.8) {
                message = '¡Excelente trabajo! Estás muy preparada. Tu dominio pedagógico es destacable.';
            } else if (percentage >= 0.6) {
                message = '¡Muy bien! Un puntaje sólido. Sigue leyendo las explicaciones para pulir detalles.';
            } else {
                message = 'Recuerda leer siempre la justificación de las respuestas. ¡La práctica hace al maestro!';
            }
            document.getElementById('final-message').textContent = message;
        }
        
        // Start automatically
        // Check hash for translation persistency
        if(window.location.hash.includes("googtrans(en|es)")) {
            document.getElementById('lang-btn').innerText = "🔄 Restaurar a Inglés original";
            document.getElementById('lang-btn').onclick = function() {
                window.location.hash = "";
                location.reload();
            }
        }

        renderQuestion();
    </script>
</body>
</html>
