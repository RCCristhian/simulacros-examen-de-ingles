    <script>
        const questions = [{"id": 1, "text": "Fernanda is a student that has physical disability and uses a wheelchair to move around. She is going to enroll in a new school next week. Therefore, the classroom teacher organizes an assembly to raise awareness of Fernanda's condition. During the assembly, three students are discussing the different ways in which they can help Fernanda move around the school. Which of the following students' comments is aligned to the Approach to Inclusive Education of the National Curriculum for Basic Education?", "options": [{"id": "A", "text": "\"To move Fernanda around, we have to take her in her wheelchair so that she can go with us wherever we go...\""}, {"id": "B", "text": "\"If we want to help Fernanda move around the school, we'd better ask her when she requires our help...\""}, {"id": "C", "text": "\"I consider it will be a good idea to keep an eye on Fernanda...\""}], "correct": "B"}, {"id": 2, "text": "As part of the project \"I take care of my community,\" the students have identified different problems... Which of the following strategies is more appropriate to carry out?", "options": [{"id": "A", "text": "Tell the students to ask the neighbors what complaints they have..."}, {"id": "B", "text": "Discuss with the students the limitations that not being able to use the soccer field causes..."}, {"id": "C", "text": "Ask the students to be part of a plenary session to talk about the improvements..."}], "correct": "B"}, {"id": 3, "text": "Brenda has asked the students to describe the furniture in their favorite room at home. After giving the instructions for the activity, one student asks, \"What does 'furniture' mean?\" and Brenda answers, \"Oh, tables and chairs are pieces of furniture.\" Which strategy for scaffolding students' understanding has Brenda used?", "options": [{"id": "A", "text": "Chunking."}, {"id": "B", "text": "Modeling."}, {"id": "C", "text": "Exemplification."}], "correct": "C"}, {"id": 4, "text": "Harold wants the students in his class to improve their cohesion in a written text through the use of discourse markers... Which of the following writing tasks will better help the students practice the use of discourse markers?", "options": [{"id": "A", "text": "A brief article about the importance of consuming local food. The students have to include convincing information..."}, {"id": "B", "text": "A list of the five most popular local food in the students' community..."}, {"id": "C", "text": "A poster encouraging people to consume local food more often..."}], "correct": "A"}, {"id": 5, "text": "Dario wants his third-grade students to describe past events using the simple past tense, so he has planned a lesson using the Inductive Approach. Which of the following strategies is most appropriate to carry out?", "options": [{"id": "A", "text": "The teacher tells the students a well-known fairy tale emphasizing the past events..."}, {"id": "B", "text": "The teacher talks about the activities he did for fun when he was a child..."}, {"id": "C", "text": "The teacher asks the students to read a singer's biography and underline five sentences in simple past tense..."}], "correct": "C"}, {"id": 6, "text": "Jaime has told the students to imagine they have to talk to a friend who is having trouble... Which of the following language functions promotes the use of the expressions provided?", "options": [{"id": "A", "text": "Reassuring someone."}, {"id": "B", "text": "Expressing concern."}, {"id": "C", "text": "Giving advice."}], "correct": "A"}, {"id": 7, "text": "Cesar's third-grade students have been talking about the best travel destinations... Which of the strategies Cesar has thought of is least communicative?", "options": [{"id": "A", "text": "Strategy 1: Ask the students to get in pairs and talk about a place they have visited..."}, {"id": "B", "text": "Strategy 2: Ask the students to give an oral presentation on the best places..."}, {"id": "C", "text": "Strategy 3: Ask the students to play the roles of a tourist and a journalist..."}], "correct": "B"}, {"id": 9, "text": "Now, Marina wants the students to practice their skimming skills... Which of the following strategies is appropriate for Marina's purpose?", "options": [{"id": "A", "text": "She asks the students to read the text quickly in order to get the general idea..."}, {"id": "B", "text": "She asks the students to read the text carefully in order to answer some comprehension questions..."}, {"id": "C", "text": "She asks the students to read the text and circle the words they are not familiar with..."}], "correct": "A"}, {"id": 10, "text": "At another stage, Marina gives each student the following chart linking Activities and People's names. Then she gives her students the following instructions: \"Read the text again, and based on the information, decide which activity is best for each of the people presented in the text.\" Which reading skill is NOT promoted in the activity above?", "options": [{"id": "A", "text": "Ordering."}, {"id": "B", "text": "Scanning."}, {"id": "C", "text": "Inferring information."}], "correct": "A"}, {"id": 11, "text": "In the next activity, Marina groups the students and asks them to answer the following questions: Is a person's age relevant to learn English? Explain. What advice would you give the people in the text to learn English in a fun way? Which reading skill are the students in Marina's class working on?", "options": [{"id": "A", "text": "Contextualizing information from the text."}, {"id": "B", "text": "Reflecting on the content of the text."}, {"id": "C", "text": "Retrieving information from the text."}], "correct": "B"}, {"id": 12, "text": "Diana wants her fifth-grade students to develop stronger argumentation skills through a class discussion... Which of the following activities is more appropriate to assign the students as homework in order to help them develop stronger argumentation skills?", "options": [{"id": "A", "text": "Ask the students to rehearse presenting their arguments in order to gain confidence and fluency."}, {"id": "B", "text": "Ask the students to add extra arguments so that their ideas are more interesting and convincing."}, {"id": "C", "text": "Ask the students to look for evidence included in different sources of information and add it to their arguments."}], "correct": "C"}, {"id": 13, "text": "Consuelo's students are going to be speakers in their science school fair. She provides the students with the following expressions to be used during the event... Which of the following language functions DOES NOT correspond to the expressions presented above?", "options": [{"id": "A", "text": "Providing background."}, {"id": "B", "text": "Summarizing an idea."}, {"id": "C", "text": "Changing the topic."}], "correct": "B"}, {"id": 14, "text": "Manuela has asked the students in her class to role-play a situation in pairs. When Sheila and Joaquin are performing the role-play, Joaquin makes a grammar mistake, but Sheila understands what he means and continues with the activity. Which of the following actions is NOT appropriate to carry out after the role-play?", "options": [{"id": "A", "text": "Repeat Joaquin's sentence emphasizing the mistake and encourage him to say the correct form."}, {"id": "B", "text": "Give Joaquin a note including the mistake and its correct form so that he can be aware of the mistake."}, {"id": "C", "text": "Make a comment pointing out Joaquin's mistake, correct it and tell him to write a sentence using that form."}], "correct": "C"}, {"id": 16, "text": "Once the students have finished planning their texts, Gabriela wants to give them some recommendations to write their first draft. Which of the following set of recommendations is appropriate to give at this stage of the writing process?", "options": [{"id": "A", "text": "\"Choose the most important ideas from your plan to be used as main ideas in each paragraph of your text...\""}, {"id": "B", "text": "\"Use all of the ideas from your plan to develop the texts of the essay...\""}, {"id": "C", "text": "\"Organize the information from the planning stage into sections. Pay attention to the grammar structures...\""}], "correct": "A"}, {"id": 17, "text": "When the students finish writing the first version of their texts, Gabriela asks them to exchange their text with a peer in order to revise it. Which of the following aspects should be a focus of this first revision?", "options": [{"id": "A", "text": "Appropriate extension and organization of the paragraphs."}, {"id": "B", "text": "Use of varied words and accurate grammar structures."}, {"id": "C", "text": "Understanding and delivery of the message."}], "correct": "C"}, {"id": 18, "text": "After the students have finished writing their essay, Gabriela wants them to reflect on the writing process they have gone through. Which of the following activities is least appropriate to carry out?", "options": [{"id": "A", "text": "The teacher sticks, on the board, a flipchart that shows the steps to write a text. She encourages the students to say aloud whether or not each of the steps was followed..."}, {"id": "B", "text": "The teacher asks the students to mention the steps they have followed during the writing process. From the steps mentioned, the students choose which step was the easiest or the most challenging..."}, {"id": "C", "text": "The teacher draws, on the board, three faces with different expressions: happy, sad and confused. She asks the students to choose the face that shows how they feel..."}], "correct": "A"}, {"id": 20, "text": "Now, Keyla wants her students to develop their listening skill Inferring information. Which of the following questions is it more appropriate to ask in order to achieve Keyla's purpose?", "options": [{"id": "A", "text": "How does Stephanie feel about acting?"}, {"id": "B", "text": "How experienced is Stephanie at acting?"}, {"id": "C", "text": "How long has Stephanie worked non-stop?"}], "correct": "A"}, {"id": 22, "text": "The students in Andrea's class are working on the text \"The future of technology.\" During one of the activities, Andrea notices that some students are having difficulty understanding the meaning of some words from the text. As a consequence, those students are taking longer to finish the activities planned. What should Andrea do to prevent this situation from happening again?", "options": [{"id": "A", "text": "Letting students use a bilingual dictionary."}, {"id": "B", "text": "Pre-teaching vocabulary."}, {"id": "C", "text": "Allowing extra time."}], "correct": "B"}, {"id": 23, "text": "Josue has asked his fourth-grade students to bring some items to sell at the classroom market. He has planned a speaking activity where students use expressions like \"How much...?\", \"Could you make that...?\", \"That's a deal\". What are the two language functions involved in this speaking activity?", "options": [{"id": "A", "text": "Talking about prices and quantities / Using expressions to negotiate."}, {"id": "B", "text": "Requesting services / Asking and answering in a polite way."}, {"id": "C", "text": "Getting to know likes and dislikes / Requesting deeper information."}], "correct": "A"}, {"id": 24, "text": "Marcia wants to involve her students in intensive listening tasks. She will use a short video recipe on how to make spaghetti. She has thought of the following listening tasks: Task 1: choose a favorite moment. Task 2: take notes of ingredients and amounts. Task 3: give an opinion about the recipe. Which of the listening tasks above is appropriate to achieve the teacher's purpose?", "options": [{"id": "A", "text": "Task 1."}, {"id": "B", "text": "Task 2."}, {"id": "C", "text": "Task 3."}], "correct": "B"}, {"id": 25, "text": "Rafael wanted to plan a communicative speaking assessment for his third-grade students using a dice game with weather words to build sentences like \"Today is cloudy\". Given Rafael's goal of designing a communicative speaking assessment, which of the following criticisms of this activity is appropriate?", "options": [{"id": "A", "text": "The activity provides limited speaking practice."}, {"id": "B", "text": "Game-like activities may not be used for speaking evaluation."}, {"id": "C", "text": "Students do not have enough vocabulary to build complete sentences."}], "correct": "A"}, {"id": 26, "text": "Carmelo's students have been talking about activities they used to do when they were younger, but they don't do anymore. Now, he wants them to participate in a discussion related to that topic using expressions like: \"I wouldn't want to do that again.\", \"That's a load off my mind.\", \"Phew! Thank goodness!\". Which of the following language functions is Carmelo trying to promote?", "options": [{"id": "A", "text": "Expressing disappointment."}, {"id": "B", "text": "Expressing annoyance."}, {"id": "C", "text": "Expressing relief."}], "correct": "C"}, {"id": 27, "text": "Patricia wants the students in her class to get familiar with the topic of daily routines using the Lexical Approach. Which of the following strategies is it appropriate to carry out?", "options": [{"id": "A", "text": "The teacher gives each student a worksheet containing sentences that describe people's daily routines with a gap that should be filled in with a verb."}, {"id": "B", "text": "The teacher hands out each student an infographic that contains a famous person's routine. She asks them to read and identify collocations such as \"take a shower\". Then the students use those collocations to describe their own daily routines."}, {"id": "C", "text": "The teacher reads the students the story \"A day in my life.\" As she reads the story, she asks the students to raise their hands every time they hear an expression or phrase that describes a daily activity."}], "correct": "B"}, {"id": 28, "text": "Marcos has noticed that the English level of one of his students, Federico, is way higher than the rest of the class. As a result, he finishes all the writing tasks too soon and, of course, they are flawless. How should Marcos handle Federico's case?", "options": [{"id": "A", "text": "He can tell Federico to remain in silence and allow him to do something else."}, {"id": "B", "text": "He can plan a more challenging version of the writing tasks for Federico."}, {"id": "C", "text": "He can appoint Federico as secretary and let him assess his classmates' texts."}], "correct": "B"}, {"id": 29, "text": "Eulogio wants his third-grade students to infer information from the audio of a story. Which of the following activities develops that skill appropriately?", "options": [{"id": "A", "text": "Ask the students to pay attention to the expressions the characters used in the story. Encourage the students to say if the characters know each other and explain why."}, {"id": "B", "text": "Ask the students to take notes on the most important ideas included in the story. Encourage the students to write a summary including that information."}, {"id": "C", "text": "Ask the students to choose the moment from the story they liked or didn't like the most. Encourage the students to support their ideas."}], "correct": "A"}, {"id": 30, "text": "Vanessa's students are going to read a text titled \"How to help your community\" and she wants to set a pre-reading task. In order to achieve this goal, which of the following tasks is appropriate?", "options": [{"id": "A", "text": "Have a discussion about the text."}, {"id": "B", "text": "Read the title, and predict the content of the text."}, {"id": "C", "text": "Scan new idiomatic expressions shown in the text."}], "correct": "B"}, {"id": 31, "text": "Camilo's students are going to listen to a short audio about candidates applying for different jobs. Before the students listen to the audio, the teacher shows flashcards, elicits job titles, asks students to discuss qualities needed, and tells them they will listen to an audio. Based on the activities presented, which stage of the lesson is Camilo developing?", "options": [{"id": "A", "text": "Lead-in."}, {"id": "B", "text": "Presentation."}, {"id": "C", "text": "Controlled practice."}], "correct": "A"}, {"id": 32, "text": "Mario wants his fourth-grade students to do free writing about the topic \"Past experiences.\" Which of the following activities is it appropriate to carry out?", "options": [{"id": "A", "text": "Ask the students to write \"past experiences\" in the center of a piece of paper and add some ideas surrounding the phrase."}, {"id": "B", "text": "Ask the students to write the following questions: Who? What? Where? When? Why? And How? Tell the students to think about a past experience and answer those questions."}, {"id": "C", "text": "Ask the students to write some sentences about any past experience that comes to mind. Tell the students that they have to write as much as they can for ten minutes."}], "correct": "C"}, {"id": 33, "text": "Junior's students are going to read a text about technology. Before the students start reading the text, he wants to give an appropriate instruction for the first reading. What instruction should be given?", "options": [{"id": "A", "text": "\"Try to determine the main idea.\""}, {"id": "B", "text": "\"Focus on what kind of verbs are used.\""}, {"id": "C", "text": "\"Underline the new expressions displayed.\""}], "correct": "A"}, {"id": 35, "text": "Florencia asks her students to listen to the radio spot... Then she asks the students to come up with a phrase or sentence that expresses what the audio is about. Which of the following listening skills is being developed through this activity?", "options": [{"id": "A", "text": "Listening for gist."}, {"id": "B", "text": "Predicting content."}, {"id": "C", "text": "Listening for details."}], "correct": "A"}, {"id": 36, "text": "Now, the students listen to the radio spot again and write down the sports mentioned in the audio. Which of the following listening skills is being developed through this activity?", "options": [{"id": "A", "text": "Paraphrasing."}, {"id": "B", "text": "Detecting connectors."}, {"id": "C", "text": "Listening for specific information."}], "correct": "C"}, {"id": 37, "text": "Next, the teacher wants her students to work on a post-listening task to develop their speaking skills. Which of the following tasks is appropriate to achieve the teacher's purpose?", "options": [{"id": "A", "text": "Ask the students to record their own radio spot for a sports event in their community. Tell them to include some features of the spot they have just listened to..."}, {"id": "B", "text": "Play the radio spot again and ask the students to write as much information as possible in their notebooks. Tell them to use their notes to write a new version..."}, {"id": "C", "text": "Give each student a worksheet that contains the radio spot with some blanks in it. Ask the students to listen carefully and fill in the blanks..."}], "correct": "A"}, {"id": 38, "text": "Read the following teaching sequence: The students look at some flashcards. The teacher gives a short dialogue to read. The teacher asks them to repeat the dialogue twice after him/her. Finally, the students read aloud the conversation in pairs. Why is this teaching sequence inappropriate to develop speaking?", "options": [{"id": "A", "text": "It requires more pronunciation practice."}, {"id": "B", "text": "It does not have a presentation stage."}, {"id": "C", "text": "It lacks a production stage."}], "correct": "C"}, {"id": 39, "text": "Victor wants his students to practice the speaking skill of communicating ideas fluently through the topic \"My daily routine.\" Which of the following activities is most appropriate to carry out?", "options": [{"id": "A", "text": "The teacher asks the students to stand up and mingle. In pairs, one student describes her daily routine and the other asks follow-up questions, then they exchange roles."}, {"id": "B", "text": "The teacher asks the students to interview a classmate on everyday activities and write down the answers in their notebooks. Then they prepare a short oral report."}, {"id": "C", "text": "The teacher asks the students to make a list of the activities they do every day. Then some volunteers read their lists to the rest of the class."}], "correct": "A"}, {"id": 40, "text": "Kevin has prepared the reading material for his second-grade class which includes the fable titled \"The tortoise and the hare.\" After having worked on different reading tasks, Kevin wants his students to think critically on the text. Given this goal, which of the following questions is appropriate?", "options": [{"id": "A", "text": "What is the main topic of the fable?"}, {"id": "B", "text": "Where did the hare finally take a nap?"}, {"id": "C", "text": "Why do you think the tortoise never gave up running?"}], "correct": "C"}, {"id": 41, "text": "Which of the following sets of strategies is the most appropriate to develop the language function \"Introducing people\" through speaking?", "options": [{"id": "A", "text": "The students watch a video... write down the conversation... complete some related conversations in the book... practice one of the conversations... present to the class."}, {"id": "B", "text": "The teacher shows a picture... explains on the board the structure This is + person's name... writes examples... students complete blanks in a worksheet... present to the class."}, {"id": "C", "text": "The teacher shows flashcards... shows a model conversation on the board... asks which expressions are used... students practice the conversation using gestures and real names... act out the conversation."}], "correct": "C"}, {"id": 42, "text": "The school year is almost starting so Yola is reviewing the syllabus for the first two months. She identifies the grammar structures she will work on and associates each one to a function: 'Talking about location' -> Prepositions. 'Giving directions' -> Yes-no questions with modals. 'Making suggestions' -> Why don't we, What about. Unfortunately, she has made one mistake. Which of the structures in Yola's notes have been associated to the wrong function?", "options": [{"id": "A", "text": "Prepositions (in, on, under, next, between, at)."}, {"id": "B", "text": "Yes-no questions with modals (may, could, would)."}, {"id": "C", "text": "Why don't we (+ base form verb), What about (+ -ing)?"}], "correct": "B"}, {"id": 43, "text": "Read the following situation: Rommy's students have written a text about \"The pros and cons of social networks.\" Before collecting the texts, Rommy wants her students to do a final revision focused on three criteria. Criterion 1: vocabulary is appropriate. Criterion 2: linking words have been used properly. Criterion 3: topic is well developed and sentences support it adequately. Which criterion promotes the revision of cohesion?", "options": [{"id": "A", "text": "Criterion 1."}, {"id": "B", "text": "Criterion 2."}, {"id": "C", "text": "Criterion 3."}], "correct": "B"}, {"id": 44, "text": "Which criterion promotes the revision of coherence?", "options": [{"id": "A", "text": "Criterion 1."}, {"id": "B", "text": "Criterion 2."}, {"id": "C", "text": "Criterion 3."}], "correct": "C"}, {"id": 45, "text": "Ruben's students are learning how to introduce people for the first time. Even though they still make mistakes, they seem to be really motivated. Which of the following alternatives best describes the learning stage Ruben's students have reached?", "options": [{"id": "A", "text": "Unconscious incompetence: the student does not know or understand how to use the language function and does not know it exists."}, {"id": "B", "text": "Conscious competence: the student has mastered the language function and the skill appears easily while performing others."}, {"id": "C", "text": "Conscious incompetence: the student knows the language function exists (though he does not know or understand how to use it) and values it as a learning tool."}], "correct": "C"}, {"id": 46, "text": "CLOZE: Read the following text excerpt and complete the blanks with the best option. Work-life balance. Ronan: I work in a (46) ______ traditional office environment doing a typical nine-to-five job.", "options": [{"id": "A", "text": "fairly"}, {"id": "B", "text": "extremely"}, {"id": "C", "text": "constantly"}], "correct": "A"}, {"id": 47, "text": "CLOZE: I like my job, but it's annoying that my commute to work takes an hour and a half each way and most of my work could really be (47) ______ online from home.", "options": [{"id": "A", "text": "done"}, {"id": "B", "text": "started"}, {"id": "C", "text": "explained"}], "correct": "A"}, {"id": 48, "text": "CLOZE: But my boss doesn't seem to trust (48) ______ we will get any work done if left to our own devices...", "options": [{"id": "A", "text": "where"}, {"id": "B", "text": "which"}, {"id": "C", "text": "that"}], "correct": "C"}, {"id": 49, "text": "CLOZE: It's frustrating that they feel the need to monitor what we do so (49) ______ instead of judging us based on our task performance, like most companies do these days.", "options": [{"id": "A", "text": "nearly"}, {"id": "B", "text": "closely"}, {"id": "C", "text": "promptly"}], "correct": "B"}, {"id": 50, "text": "CLOZE: Jo: I used to do a typical five-day week, but I wanted to spend more time with my children before they start school... After negotiating with him, we decided to cut my working week (50) ______ to a three-day work week.", "options": [{"id": "A", "text": "in"}, {"id": "B", "text": "up"}, {"id": "C", "text": "down"}], "correct": "C"}, {"id": 51, "text": "CLOZE: I've noticed, though, that my workload (51) ______ decreased in the slightest!", "options": [{"id": "A", "text": "didn't"}, {"id": "B", "text": "hasn't"}, {"id": "C", "text": "hadn't"}], "correct": "B"}, {"id": 52, "text": "CLOZE: (52) ______ I find myself having to take work home just so that I can meet the deadlines.", "options": [{"id": "A", "text         let currentQuestionIndex = 0;
        let score = 0;

        const quizArea = document.getElementById('quiz-area');
        const progressText = document.getElementById('progress-text');
        const feedbackArea = document.getElementById('feedback');
        const btnNext = document.getElementById('btn-next');
        const resultScreen = document.getElementById('result-screen');

        function renderQuestion() {
            const oldNodes = quizArea.querySelectorAll('.question-container');
            oldNodes.forEach(node => node.remove());
            
            feedbackArea.style.display = 'none';
            btnNext.style.display = 'none';

            progressText.innerText = `Pregunta ${currentQuestionIndex + 1} de ${questions.length}`;

            const q = questions[currentQuestionIndex];
            
            const qDiv = document.createElement('div');
            qDiv.className = 'question-container active';
            
            const qText = document.createElement('div');
            qText.className = 'question-text';
            qText.innerHTML = q.text.replace(/\n/g, '<br>');
            qDiv.appendChild(qText);

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option';
                btn.innerHTML = `<strong>${String.fromCharCode(65 + index)})</strong> ${opt.text}`;
                btn.onclick = () => selectAnswer(btn, opt.id, q.correct);
                btn.dataset.id = opt.id;
                qDiv.appendChild(btn);
            });

            quizArea.appendChild(qDiv);
        }

        function selectAnswer(selectedBtn, selectedId, correctId) {
            const buttons = document.querySelectorAll('.option');
            buttons.forEach(btn => btn.disabled = true);

            if (selectedId === correctId) {
                selectedBtn.classList.add('correct');
                feedbackArea.textContent = '¡Correcto! Muy bien hecho.';
                feedbackArea.className = 'feedback-correct';
                score++;
            } else {
                selectedBtn.classList.add('incorrect');
                const correctBtn = document.querySelector(`.option[data-id="${correctId}"]`);
                if (correctBtn) correctBtn.classList.add('correct');
                
                feedbackArea.textContent = `Incorrecto. La respuesta correcta era la alternativa ${correctId}.`;
                feedbackArea.className = 'feedback-incorrect';
            }

            feedbackArea.style.display = 'block';
            btnNext.style.display = 'block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                renderQuestion();
                window.scrollTo(0,0);
            } else {
                showResults();
            }
        }

        function showResults() {
            quizArea.style.display = 'none';
            feedbackArea.style.display = 'none';
            btnNext.style.display = 'none';
            
            resultScreen.style.display = 'block';
            document.getElementById('final-score').textContent = `${score} / ${questions.length}`;
            
            let message = '';
            const percentage = score / questions.length;
            if (percentage >= 0.8) {
                message = '¡Excelente trabajo! Se nota un gran dominio de los enfoques y temas pedagógicos.';
            } else if (percentage >= 0.5) {
                message = '¡Buen esfuerzo! Sigue practicando con más preguntas para perfeccionar el análisis de los casos.';
            } else {
                message = 'Sigue practicando. El análisis de casos requiere mucha lectura, ¡cada intento es un paso más hacia la meta!';
            }
            document.getElementById('final-message').textContent = message;
        }

        renderQuestion();
    </script>
