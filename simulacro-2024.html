    <script>
        const questions = [{"id": 1, "text": "Dario wants his students to work on written cohesion before they start writing their own article. Which of the following strategies is appropriate to achieve Dario's purpose?", "options": [{"id": "A", "text": "The teacher brings envelopes that contain pieces of an article that he has previously cut up and mixed up. Next, he groups the students, gives each group an envelope and asks them to put the parts of the article in the correct order. Then they check the order of the article as a whole class."}, {"id": "B", "text": "The teacher gives each student a five-paragraph article and writes some sentences on the board. Next, he asks the students to insert the sentences in the most logical place within the paragraphs. Then they compare their choices with a classmate."}, {"id": "C", "text": "The teacher gives the students an article that has some blanks. Next, he asks the students to fill in the blanks with an appropriate signal or reference word. Then the students get in groups to check their answers."}], "correct": "C"}, {"id": 2, "text": "Bartolom\u00e9 wants his students to discuss on the following question: \"Should tablets replace textbooks in high schools?\" During the discussion, Bartolom\u00e9 wants his students to use the following expressions: I think your idea is pretty accurate. However, we should consider... Could you say that again, please? I'm sorry, I did not get your point. It's important that you... Which of the following language functions is NOT involved in the expressions above?", "options": [{"id": "A", "text": "Asking for clarifications."}, {"id": "B", "text": "Responding to praise."}, {"id": "C", "text": "Persuading others."}], "correct": "B"}, {"id": 3, "text": "Ofelia wants to help her third-grade students improve their listening skills using authentic listening resources on movie reviews. Which of the following activities is using those types of resources?", "options": [{"id": "A", "text": "The students listen to the recording of a graded level movie review. Then they discuss if they agree or not with the comments given in the review."}, {"id": "B", "text": "The students listen to a movie review podcast. After that, based on the content of the podcast, they make a comic strip that depicts the story of the movie."}, {"id": "C", "text": "The students listen to an audio of a movie review recorded by their teacher and a colleague. Next, based on the information heard, the students identify the elements of the movie review."}], "correct": "B"}, {"id": 4, "text": "Abel has noticed that his students usually have difficulties managing their time when working in group discussions and, as a consequence, they don't finish the activities assigned. Aware of that situation, he wants to help his students manage their time better. Which of the following actions is NOT appropriate to achieve his purpose?", "options": [{"id": "A", "text": "Let students work and, when the time is over, collect only the products of the groups that have finished the activity. This way, students in other groups will manage their time better in future activities."}, {"id": "B", "text": "Set time limits before the activity starts and, while the students are working, remind them occasionally how much time they still have ahead. This way, the students will try to finish the task on time."}, {"id": "C", "text": "Assign each student of the group a role (time controller, secretary, reporter, etc.). This way, they will stay focused on the role they were assigned and won't get distracted from the task."}], "correct": "A"}, {"id": 5, "text": "Read the following situation: During a speaking session, Sara provides the students with the following input (Conversation pieces). First, Sara gives each student a copy of the conversation above. She asks them to put the sentences in the correct order, following the logical sequence of the conversation and paying attention to how well the ideas fit together. Which of the following aspects of language is involved in Sara's activity?", "options": [{"id": "A", "text": "Fluency."}, {"id": "B", "text": "Cohesion."}, {"id": "C", "text": "Coherence."}], "correct": "C"}, {"id": 6, "text": "Considering the content of the conversation (Asking about a good restaurant/cafe and getting help), which of the following functions is involved in it?", "options": [{"id": "A", "text": "Asking for location."}, {"id": "B", "text": "Giving directions."}, {"id": "C", "text": "Offering help."}], "correct": "A"}, {"id": 7, "text": "Next, Sara would like her students to practice the conversation using their nonverbal and paraverbal sources. She is about to give the students some instructions to practice the conversation. Which would be the least appropriate instruction to accomplish Sara's aim?", "options": [{"id": "A", "text": "\"Practice the conversation using the right pace to deliver the information thoroughly. Don't forget to focus on your body language.\""}, {"id": "B", "text": "\"Practice the conversation using the right tone to convey your message clearly. Also, remember that you have to focus on your facial expressions.\""}, {"id": "C", "text": "\"Practice the conversation using the right pronunciation to make sure your classmates understand you. Additionally, be ready to say your lines properly.\""}], "correct": "C"}, {"id": 8, "text": "During a writing session, Rosa has asked her students to imagine they have a friend in another country. She asks them to write an e-mail to that friend describing their vacation plans. Before the students write the text, Rosa wants them to make an outline. Which of the following strategies is appropriate to achieve the teacher's purpose?", "options": [{"id": "A", "text": "Tell the students to write some sentences describing their vacation plans and put those sentences into paragraphs. Ask the students to connect the sentences and paragraphs using varied linking words..."}, {"id": "B", "text": "Tell the students to make a list of their vacation plans and add some details about each plan. Ask the students to use brief and concise information in each plan..."}, {"id": "C", "text": "Tell the students to write, in their notebooks, as many ideas as possible about their vacation plans. Ask the students to choose the information they consider more interesting to include..."}], "correct": "B"}, {"id": 9, "text": "Luisa's students are going to watch a short video about popular sports among young people. She wants to engage the students in a meaningful activity before they watch the video. Which of the following activities is most appropriate to achieve Luisa's purpose?", "options": [{"id": "A", "text": "The teacher shows the students pictures of sports and athletes. Next, the students mention what they see in the pictures..."}, {"id": "B", "text": "The teacher gets the students to brainstorm words connected to sports. They write the words in their notebooks..."}, {"id": "C", "text": "The teacher writes questions related to the sports the students play or would like to play. They discuss the questions in pairs..."}], "correct": "C"}, {"id": 10, "text": "Amanda wants the students in her class to use the following expressions in a dialogue: I'd rather go to ... It's very kind of you, but... Actually, I think I'm going to pass on it. Let me sleep on it. Which of the following language functions is Amanda trying to promote with the expressions above?", "options": [{"id": "A", "text": "Disagreeing with an opinion."}, {"id": "B", "text": "Expressing preference."}, {"id": "C", "text": "Rejecting an offer."}], "correct": "C"}, {"id": 11, "text": "Maximiliano wants to use bottom-up processing to help his students develop their listening skills. He has thought of three activities to be presented before the students listen to the talk \"Stay safe during an earthquake.\" Which of the activities he has thought of is related to bottom-up processing?", "options": [{"id": "A", "text": "The teacher gives each student a list of key words from the talk. He practices the pronunciation of the words..."}, {"id": "B", "text": "The teacher shows some pictures that are related to the talk and some pictures that aren't..."}, {"id": "C", "text": "The teacher writes on the board the title of the talk. He asks the students to think of the possible content..."}], "correct": "A"}, {"id": 12, "text": "Read the following situation: Daisy wants to help her students develop their reading skills. She has brought the story \"The Ugly Duckling\". Before the students read the text, Daisy wants to activate the students' prior knowledge about the story. Which of the following activities is NOT appropriate to carry out?", "options": [{"id": "A", "text": "Tell the students they are going to read the story using a puzzle that contains parts of the written story..."}, {"id": "B", "text": "Stick, on the board, pictures of the characters of the story. Write the names of the characters under each picture..."}, {"id": "C", "text": "Show the students the cover of the story. On the board, write some questions to predict what comes in the story..."}], "correct": "A"}, {"id": 13, "text": "After the students read the text once, Daisy wants them to interpret information from it. Which of the following questions is appropriate for the teacher's purpose?", "options": [{"id": "A", "text": "Why did The Ugly Duckling live in the barn for some time?"}, {"id": "B", "text": "Why did Mother Duck say \"but never mind. I'm sure you've got a heart of gold\"?"}, {"id": "C", "text": "Why did the other animals reject The Ugly Duckling when he wanted to play with them?"}], "correct": "B"}, {"id": 14, "text": "Here are some sentences that the characters used in the story: \"You do look different... but never mind.\" \"Even though I'm not fluffy... I'm just as good!\" \"Our growing process takes longer. Still, we have to be patient.\" Which of the following language functions is related to the expressions in bold?", "options": [{"id": "A", "text": "Contrasting ideas."}, {"id": "B", "text": "Expressing disbelief."}, {"id": "C", "text": "Restating information."}], "correct": "A"}, {"id": 15, "text": "Next, Daisy writes some questions on the board and asks the students to discuss them in pairs: What do you think about the behavior of the characters? What would you do if you were The Ugly Duckling's mother? What did you learn from the story? What is Daisy aiming at with the questions presented?", "options": [{"id": "A", "text": "Having the students retrieve explicit information."}, {"id": "B", "text": "Having the students develop critical thinking skills."}, {"id": "C", "text": "Having the students summarize the content of the story."}], "correct": "B"}, {"id": 16, "text": "After the students have worked on different comprehension tasks, Daisy wants them to develop their writing skills through a post-reading task. Which of the following tasks is more appropriate to carry out?", "options": [{"id": "A", "text": "Ask the students to write an extra paragraph about the future of the duckling after realizing he was a beautiful swam."}, {"id": "B", "text": "Write, on the board, five questions about the text and ask the students to answer them using the information provided..."}, {"id": "C", "text": "Encourage the students to make a list of words that were new for them in the text and ask them to make a sentence with each..."}], "correct": "A"}, {"id": 17, "text": "Thalia wants her students to practice demonstratives (this/that/these/those). Which of the strategies Thalia has thought of corresponds to the Functional approach?", "options": [{"id": "A", "text": "Strategy 1: The teacher writes sentences on the board... draws a chart... explains rules."}, {"id": "B", "text": "Strategy 2: The teacher tells the students to imagine they are packing their clothing before going on a trip. She writes prompts... students develop a dialogue."}, {"id": "C", "text": "Strategy 3: The teacher shows her cellphone and says \"This cellphone is nice.\" Then she asks questions: \"Is it singular or plural?\"..."}], "correct": "B"}, {"id": 18, "text": "Marisela's students are participating in a debate as part of a free speaking activity. While debating, a student forgets a word, stops speaking, and makes some effort to remember the word. Given that situation, which could be the best way to correct the student's mistake?", "options": [{"id": "A", "text": "Say the word the student has forgotten and ask him to repeat the word after her."}, {"id": "B", "text": "Call on a volunteer to help the student recall the word he has forgotten."}, {"id": "C", "text": "Tell the student not to worry and ask him to carry on with his arguments."}], "correct": "C"}, {"id": 19, "text": "Aldo's fifth-grade students are reading an article called \"Cultures around the world,\" and he wants to check students' understanding of the content through formative assessment. Which of the following activities is NOT appropriate to achieve Aldo's purpose?", "options": [{"id": "A", "text": "The students work in groups to make a poster... Aldo uses a rubric to give a score to each of the presentations of the posters."}, {"id": "B", "text": "The students work in groups to draw a concept map... Aldo uses a checklist to monitor reading comprehension and writes some recommendations if needed."}, {"id": "C", "text": "The students work in pairs to discuss some open-ended questions... Aldo walks around the classroom and makes some comments about the students' answers."}], "correct": "C"}, {"id": 20, "text": "Luz is checking the written production of her second-grade students... Leonardo's text: \"My brother is a student. He wakes up 7am. He has breakfast 7.20. We go school 8 am...\". Luz will check Leonardo's text. Which of the following aspects should be prioritized in the revision of Leonardo's text?", "options": [{"id": "A", "text": "Word order."}, {"id": "B", "text": "Prepositions."}, {"id": "C", "text": "Verb tense."}], "correct": "A"}, {"id": 21, "text": "During a reading session, Oswaldo's students are giving the text a first reading. While reading, a student raises his hand and asks the teacher for the meaning of the phrasal verb \"back up.\" Which of the following actions is better for the teacher to carry out?", "options": [{"id": "A", "text": "Tell the student that, at this point, it is important to understand the general idea. Then point out that there will be a moment to check vocabulary..."}, {"id": "B", "text": "Tell the student that the phrasal verb \"back up\" is similar in meaning to \"support\" or \"confirm,\" but that it's more informal. Then give an example..."}, {"id": "C", "text": "Tell the student what a phrasal verb is and explain the meaning of \"back up\" in English. If the student doesn't understand, translate it into Spanish..."}], "correct": "B"}, {"id": 22, "text": "Teofilo has noticed that some of the students seem uninterested and bored at the beginning of the lessons. He asks his colleagues to suggest an activity to start his lesson. Bernardo: \"activity that helps activate students' schemata\". Carmen: \"students introduce each other\". Dionisio: \"game or an energizer\". Which of Teofilo's colleagues has suggested a warm-up?", "options": [{"id": "A", "text": "Bernardo."}, {"id": "B", "text": "Carmen."}, {"id": "C", "text": "Dionisio."}], "correct": "C"}, {"id": 23, "text": "Irene would like her students to perform a roleplay, within the context of two language functions. For this purpose, she provides them with these expressions: What happened? How are you feeling? Are you ok? You look worried... Before you move on, I'd like to say... Can I just add something here? Which two language functions are the ones Irene would like her students to practice?", "options": [{"id": "A", "text": "Complimenting someone / establishing guidelines."}, {"id": "B", "text": "Expressing concern / interrupting another speaker politely."}, {"id": "C", "text": "Asking about other people's opinions / clarifying or arranging one's ideas."}], "correct": "C"}, {"id": 24, "text": "Anna's students are going to listen to a conversation... Before the students listen to the conversation, Anna gives the following instructions: \"You are going to listen to a short conversation between two friends. Listen to it once and answer: What is the subject of the conversation?\" Which skill is the teacher trying to develop with her question?", "options": [{"id": "A", "text": "Listening for gist."}, {"id": "B", "text": "Inferring attitude."}, {"id": "C", "text": "Listening for details."}], "correct": "B"}, {"id": 25, "text": "Victor's third-grade students have written a text in which they give advice to a friend. Now, the teacher is correcting the students' texts. Here is a comment: \"This is a great text. You have included really useful pieces of advice... However, you could have used more of the expressions to give advice we studied in our previous sessions.\" Based on the comment above, what was Victor's feedback focus?", "options": [{"id": "A", "text": "Organization."}, {"id": "B", "text": "Accuracy."}, {"id": "C", "text": "Range."}], "correct": "A"}, {"id": 26, "text": "During a reading session, Hubner's students have answered some questions related to the text they have just read. Before he calls on volunteers, he asks them to compare their answers in pairs. Which of the following purposes is involved in Hubner's action?", "options": [{"id": "A", "text": "He wants to give the students some thinking time."}, {"id": "B", "text": "He wants to make sure that the students complete the task quickly."}, {"id": "C", "text": "He wants to give the students confidence before the whole class hears their responses."}], "correct": "C"}, {"id": 27, "text": "Susana's students have been practicing how to ask and answer information questions. However, some students still have problems formulating this kind of questions. Aware of that, Susana wants to help her students improve their accuracy. She has thought of the three activities. Which of the activities Susana has thought of is least appropriate for her purpose?", "options": [{"id": "A", "text": "Activity 1: The teacher writes five incorrect information questions on the board. She pairs up the students and asks them to identify the mistakes and correct them."}, {"id": "B", "text": "Activity 2: The teacher brings copies of a song that contains information questions... She asks them to circle the information questions in the song. Finally, the teacher plays the song..."}, {"id": "C", "text": "Activity 3: The teacher pairs up the students and gives each pair a set of scrambled information questions. The students unscramble the questions..."}], "correct": "B"}, {"id": 28, "text": "Margot's students are going to have a conversation in pairs... She asks her students to include the expressions they have been practicing: As a rule... By and large... On the whole... What normally happens is... Which of the following language functions corresponds to the expressions Margot wants her students to practice?", "options": [{"id": "A", "text": "Expressing hopes."}, {"id": "B", "text": "Making generalizations."}, {"id": "C", "text": "Expressing degrees of certainty."}], "correct": "B"}, {"id": 29, "text": "During the past few sessions, Wilmer's students have been practicing the function \"Greeting and introducing people.\" Now, he wants them to use that function through a speaking communicative activity. Given this goal, which of the following activities is it more appropriate to carry out?", "options": [{"id": "A", "text": "The teacher elicits some expressions used to greet and introduce people, and writes them on the board. Then he forms groups of three and sets a context for each group..."}, {"id": "B", "text": "The teacher gives each student the copy of a conversation of two students greeting and introducing themselves. He pairs up the students and asks them to practice the conversation..."}, {"id": "C", "text": "The teacher gives the students a handout that contains expressions to greet and introduce people. Then he asks the students to stand up and mingle in order to greet a classmate..."}], "correct": "A"}, {"id": 30, "text": "At the beginning of the session, Mario gives each student the reviews of two products, an iron and a microwave oven. Then he sticks the pictures of those two products on the board. Next, he asks the students to read the reviews and decide which picture each review is describing. Which reading skill does Mario want to promote with his activity?", "options": [{"id": "A", "text": "Scanning."}, {"id": "B", "text": "Skimming."}, {"id": "C", "text": "Categorizing."}], "correct": "B"}, {"id": 31, "text": "After having done some reading comprehension activities, Mario tells the students to paraphrase, orally, the review of the microwave oven: \"I'm sorry to say I'm very disappointed with this microwave oven. It's big, awful and very heavy...\". Which one shows paraphrasing skills?", "options": [{"id": "A", "text": "Juan says: \"Jen is very mad at the company that sent her the product. I think the product is ugly and big so I wouldn't buy it...\""}, {"id": "B", "text": "Alicia says: \"Jen is really unhappy with a product. The product is large, horrible, weighty and not easy to operate...\""}, {"id": "C", "text": "Lucia says: \"Jen is very disappointed with this product. It's big, awful, and very heavy so she can't carry it...\""}], "correct": "B"}, {"id": 32, "text": "Mario wants his students to work on a meaningful extension activity in which they will write a product review. Which of the activities Mario has thought of is appropriate to achieve his purpose?", "options": [{"id": "A", "text": "The teacher brings cards with the name of different products in each one. He asks the students to randomly pick a card. After that, they write a review of the product."}, {"id": "B", "text": "The teacher gives the students a review of a product. He asks them to highlight the key words in it. Then they rewrite the review substituting the key words."}, {"id": "C", "text": "The teacher tells the students to think about the products they have at home. He asks them to choose one of those products. Next, they write a review of it."}], "correct": "C"}, {"id": 33, "text": "Antonio wants to help his students develop their listening skills. For this purpose, they will listen to an interview of a celebrity. Second listening: The teacher asks the students to identify some of the questions used in the audio. Which listening skill is involved in the second listening of the sequence?", "options": [{"id": "A", "text": "Listening for global understanding."}, {"id": "B", "text": "Inferring meaning from context."}, {"id": "C", "text": "Listening for specific information."}], "correct": "C"}, {"id": 34, "text": "Which of the following listening skills is involved in the third listening of the sequence (The students listen to analyze the reporter's mood... try to identify the celebrity's reaction...)?", "options": [{"id": "A", "text": "Inferring attitude."}, {"id": "B", "text": "Detecting connectors."}, {"id": "C", "text": "Deducing meaning from context."}], "correct": "A"}, {"id": 35, "text": "Renzo's students are going to work in pairs in order to talk about challenging situations... he writes the following expressions on the board: What a shame! That's too bad. What a let-down! Considering the expressions above, which of the following language functions is Renzo going to promote with his activity?", "options": [{"id": "A", "text": "Expressing disappointment."}, {"id": "B", "text": "Expressing uncertainty."}, {"id": "C", "text": "Expressing necessity."}], "correct": "A"}, {"id": 36, "text": "Camila's students are participating in a semi-controlled speaking activity... Suddenly, she overhears Lucas, one of the students say, \"I go to travel to Cusco.\" Since Camila wants to provide Lucas with a chance to correct himself, which of the following techniques is more appropriate to use?", "options": [{"id": "A", "text": "Recast: Teacher says: \"I'm going to travel to Cusco.\""}, {"id": "B", "text": "Repetition: Teacher says: \"I go to travel?\""}, {"id": "C", "text": "Clarification request: Teacher says: \"Could you repeat your sentence?\""}], "correct": "B"}, {"id": 37, "text": "Fernando has asked his students to have a conversation in which they talk about things they did in the past, but they wish they had not done. Which language function is better to achieve Fernando's purpose?", "options": [{"id": "A", "text": "Offering apologies."}, {"id": "B", "text": "Showing sympathy."}, {"id": "C", "text": "Expressing regrets."}], "correct": "C"}, {"id": 38, "text": "Patricia wants to check her students' listening comprehension through a communicative task. Given Patricia's goal, which of the following tasks is appropriate to carry out?", "options": [{"id": "A", "text": "The students listen to a few radio news about a sports event and try to identify as many verbs as they can..."}, {"id": "B", "text": "The students listen to an audio of a man who has to make a difficult choice in his life. They get in pairs and come up with a solution for his problem."}, {"id": "C", "text": "The students listen to the recording of a conversation about global warming. Then they answer some questions about the audio in pairs."}], "correct": "B"}, {"id": 39, "text": "Maribel's students are writing an essay. Now, they are making sure that the sentences and paragraphs they wrote are well connected and that the details in their essays are closely related to the topic. They are also checking punctuation and spelling. Taking into account the actions the students are carrying out, in which stage of the writing process are they?", "options": [{"id": "A", "text": "Planning."}, {"id": "B", "text": "Drafting."}, {"id": "C", "text": "Revising."}], "correct": "C"}, {"id": 40, "text": "Danny is going to teach \"double comparatives\" using the Presentation-Practice-Production method (PPP). The students have previously learned how to compare things. He writes \"The more I practice, the better I dance\". Then incomplete sentences... Which of the PPP method stages is missing in Danny's teaching sequence?", "options": [{"id": "A", "text": "The Presentation stage."}, {"id": "B", "text": "The Production stage."}, {"id": "C", "text": "The Practice stage."}], "correct": "B"}, {"id": 41, "text": "Eugenia wants her students to discuss the following question: \"Are video games one of the leading causes of violence among teenagers?\" During the discussion, Eugenia wants her students to use the following expressions: Chances are that... My guess is that... I wouldn't be surprised if... Which of the following language functions is mostly involved in the expressions above?", "options": [{"id": "A", "text": "Making speculations."}, {"id": "B", "text": "Making suggestions."}, {"id": "C", "text": "Making requests."}], "correct": "A"}, {"id": 42, "text": "Melina wants to help her students develop their listening skills. In a lesson about birthdays, she asks her students to listen to an audio... After having worked on some comprehension activities, Melina writes a list of three items on the board: a flowerpot, a flashlight, and a watch. She asks the students to choose the item that would make an appropriate present for Tommy's dad. Then they have to justify their choice. Based on Melina's activity, which listening skill does she want the students to develop?", "options": [{"id": "A", "text": "Ordering."}, {"id": "B", "text": "Inferring information."}, {"id": "C", "text": "Deducing meaning from context."}], "correct": "B"}, {"id": 43, "text": "Finally, Melina wants to involve her students in a communicative post-listening activity. Which activity is NOT appropriate to reach Melina's goal?", "options": [{"id": "A", "text": "The teacher groups the students and asks them to talk about a present they gave to their dads in the past..."}, {"id": "B", "text": "The teacher pairs up the students and assigns each student a role: One student is Tommy and the other is Tommy's dad. They have to role-play..."}, {"id": "C", "text": "The teacher tells the students to individually think about other possible presents Tommy's father would like to get. They make a list and get ready to explain the reasons..."}], "correct": "C"}, {"id": 44, "text": "Ruben's fourth-grade students have finished writing a text on \"The role of technology in education.\" Now, Ruben gives the students the following instructions: \"Exchange your text with another classmate. Read the text and add some recommendations. Then return the text to your classmate so that he can improve it before handing in the last version.\" Which of the following types of assessment is Ruben promoting with his instructions?", "options": [{"id": "A", "text": "Co-assessment."}, {"id": "B", "text": "Self-assessment."}, {"id": "C", "text": "Peer assessment."}], "correct": "C"}, {"id": 45, "text": "Manolo's students are going to participate in a debate based on the statement \"Animal testing should be banned.\" He wants them to focus on the use of the language function Acknowledging ideas. Considering the teacher's purpose, which set of expressions is appropriate to work on this function?", "options": [{"id": "A", "text": "You are right! I also believe that... I agree with you based on.... My opinion builds upon...'s opinion."}, {"id": "B", "text": "From my perspective, I feel that... I'm sure that... In fact, it is not true that..."}, {"id": "C", "text": "I'm afraid you'll have to do it. You must reconsider..."}], "correct": "A"}, {"id": 46, "text": "CLOZE: Fight a cold by eating yogurt? This winter, there's a good chance you might be (46) ______ for anything and everything to rid yourself of an annoying, lingering and sometimes debilitating cold.", "options": [{"id": "A", "text": "finding"}, {"id": "B", "text": "looking"}, {"id": "C", "text": "wanting"}], "correct": "B"}, {"id": 47, "text": "CLOZE: You (47) ______ want to add yogurt to your list of cold-fighting remedies.", "options": [{"id": "A", "text": "will"}, {"id": "B", "text": "must"}, {"id": "C", "text": "may"}], "correct": "C"}, {"id": 48, "text": "CLOZE: That being said, there are some things in yogurt we can point to that, in theory, would be (48) ______.", "options": [{"id": "A", "text": "advantageous"}, {"id": "B", "text": "supportive"}, {"id": "C", "text": "profitable"}], "correct": "A"}, {"id": 49, "text": "CLOZE: First, yogurt is full of probiotics, which can help (49) ______ the immune system.", "options": [{"id": "A", "text": "promote"}, {"id": "B", "text": "boost"}, {"id": "C", "text": "rise"}], "correct": "B"}, {"id": 50, "text": "CLOZE: However, specific benefits can only be (50) ______ to the actual strains studied...", "options": [{"id": "A", "text": "added"}, {"id": "B", "text": "delivered"}, {"id": "C", "text": "attributed"}], "correct": "C"}, {"id": 51, "text": "CLOZE: - which do not necessarily exist in regular, non-supplemented yogurt. (51) ______, yogurt contains another immune stimulator: zinc.", "options": [{"id": "A", "text": "Additionally"}, {"id": "B", "text": "As well as"}, {"id": "C", "text": "Indeed"}], "correct": "C"}, {"id": 52, "text": "CLOZE: ...the amounts of zinc needed for benefits - at least 75 milligrams - is much higher than the 2 milligrams present (52) ______ an 8-ounce cup of yogurt.", "options": [{"id": "A", "text": "at"}, {"id": "B", "text": "on"}, {"id": "C", "text": "in"}], "correct": "A"}, {"id": 53, "text": "CLOZE: Second, yogurt is a nutritious food choice (53) ______ probiotics are beneficial to health, so including them in an overall healthy eating plan makes sense...", "options": [{"id": "A", "text": "because of"}, {"id": "B", "text": "due to"}, {"id": "C", "text": "since"}], "correct": "B"}, {"id": 54, "text": "CLOZE: ...but recommending them specifically for the common cold (54) ______ be premature.", "options": [{"id": "A", "text": "would"}, {"id": "B", "text": "should"}, {"id": "C", "text": "ought to"}], "correct": "C"}, {"id": 55, "text": "CLOZE: Third, carbohydrates in yogurt (55) ______ energy, which helps you recover from a cold.", "options": [{"id": "A", "text": "grant"}, {"id": "B", "text": "hand"}, {"id": "C", "text": "provide"}], "correct": "A"}, {"id": 56, "text": "CLOZE: One recent study... found that when women consumed yogurt every day for nine weeks, they (56) ______ reduced inflammatory markers in their blood.", "options": [{"id": "A", "text": "had"}, {"id": "B", "text": "has"}, {"id": "C", "text": "have"}], "correct": "C"}, {"id": 57, "text": "CLOZE: These findings suggest a mechanism by which yogurt might be helpful in (57) ______ cold symptoms.", "options": [{"id": "A", "text": "giving up"}, {"id": "B", "text": "turning in"}, {"id": "C", "text": "fighting off"}], "correct": "A"}, {"id": 58, "text": "CLOZE: (58) ______ the ability of yogurt to help fight a cold is theoretical right now, experts say there's no good reason not to choose yogurt when you have the sniffles...", "options": [{"id": "A", "text": "So"}, {"id": "B", "text": "Though"}, {"id": "C", "text": "Despite"}], "correct": "C"}, {"id": 59, "text": "CLOZE: Yogurt is (59) ______ and goes down easy, so if you have a sore throat, or even a runny nose, it's comfortable to eat.", "options": [{"id": "A", "text": "dull"}, {"id": "B", "text": "rough"}, {"id": "C", "text": "smooth"}], "correct": "B"}, {"id": 60, "text": "CLOZE: So, choose yogurt (60) ______ its soothing texture and nutritional attributes, which include calcium and vitamin D, along with possible cold fighters like zinc and probiotics.", "options": [{"id": "A", "text": "by"}, {"id": "B", "text": "for"}, {"id": "C", "text": "about"}], "correct": "B"}];
        
        let currentQuestionIndex = 0;
        let score = 0;

        const quizArea = document.getElementById('quiz-area');
        const progressText = document.getElementById('progress-text');
        const feedbackArea = document.getElementById('feedback');
        const btnNext = document.getElementById('btn-next');
        const resultScreen = document.getElementById('result-screen');

        function renderQuestion() {
            const oldNodes = quizArea.querySelectorAll('.question-container');
            oldNodes.forEach(node => node.remove());
            
            feedbackArea.style.display = 'none';
            btnNext.style.display = 'none';

            progressText.innerText = `Pregunta ${currentQuestionIndex + 1} de ${questions.length}`;

            const q = questions[currentQuestionIndex];
            
            const qDiv = document.createElement('div');
            qDiv.className = 'question-container active';
            
            const qText = document.createElement('div');
            qText.className = 'question-text';
            qText.innerHTML = q.text.replace(/\n/g, '<br>');
            qDiv.appendChild(qText);

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option';
                btn.innerHTML = `<strong>${String.fromCharCode(65 + index)})</strong> ${opt.text}`;
                btn.onclick = () => selectAnswer(btn, opt.id, q.correct);
                btn.dataset.id = opt.id;
                qDiv.appendChild(btn);
            });

            quizArea.appendChild(qDiv);
        }

        function selectAnswer(selectedBtn, selectedId, correctId) {
            const buttons = document.querySelectorAll('.option');
            buttons.forEach(btn => btn.disabled = true);

            if (selectedId === correctId) {
                selectedBtn.classList.add('correct');
                feedbackArea.textContent = '¡Correcto! Muy bien hecho.';
                feedbackArea.className = 'feedback-correct';
                score++;
            } else {
                selectedBtn.classList.add('incorrect');
                const correctBtn = document.querySelector(`.option[data-id="${correctId}"]`);
                if (correctBtn) correctBtn.classList.add('correct');
                
                feedbackArea.textContent = `Incorrecto. La respuesta correcta era la alternativa ${correctId}.`;
                feedbackArea.className = 'feedback-incorrect';
            }

            feedbackArea.style.display = 'block';
            btnNext.style.display = 'block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                renderQuestion();
                window.scrollTo(0,0);
            } else {
                showResults();
            }
        }

        function showResults() {
            quizArea.style.display = 'none';
            feedbackArea.style.display = 'none';
            btnNext.style.display = 'none';
            
            resultScreen.style.display = 'block';
            document.getElementById('final-score').textContent = `${score} / ${questions.length}`;
            
            let message = '';
            const percentage = score / questions.length;
            if (percentage >= 0.8) {
                message = '¡Excelente trabajo! Se nota un gran dominio de los enfoques y temas pedagógicos.';
            } else if (percentage >= 0.5) {
                message = '¡Buen esfuerzo! Sigue practicando con más preguntas para perfeccionar el análisis de los casos.';
            } else {
                message = 'Sigue practicando. El análisis de casos requiere mucha lectura, ¡cada intento es un paso más hacia la meta!';
            }
            document.getElementById('final-message').textContent = message;
        }

        renderQuestion();
    </script>
